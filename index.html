<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agricultura PEGSA · G&V · Merz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f2;--card:#fff;--ink:#1d2a1f;--muted:#6b7570;--line:#dfe3dc;
  --green:#2f6b3a;--green-2:#e6f1e8;--amber:#b7791f;--amber-2:#fdf3e1;--red:#b3362f;--red-2:#fbe9e7;
  --blue:#2c5f8a;--blue-2:#e5eef7;--radius:10px;
  --pegsa:#2f6b3a;--gyv:#2c5f8a;--merz:#b7791f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .5rem;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.15rem}h3{font-size:1rem}
a{color:var(--blue)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85em}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px;height:54px}
#topbar .brand{font-weight:700;font-size:1.02rem;white-space:nowrap}
#topbar .brand span{color:var(--green)}
#topbar .grow{flex:1}
#topbar select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
#modebadge{font-size:.75rem;padding:3px 8px;border-radius:99px;background:var(--amber-2);color:var(--amber);font-weight:600}
#modebadge.online{background:var(--green-2);color:var(--green)}

/* ---- tabs ---- */
#tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
#tabs button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;cursor:pointer;font-weight:550}
#tabs button.active{color:var(--green);border-color:var(--green)}
#tabs button .n{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--bg);color:var(--muted);font-size:.72rem;text-align:center;margin-right:6px}
#tabs button.active .n{background:var(--green);color:#fff}

main{padding:16px;max-width:1500px;margin:0 auto}
.tab{display:none}.tab.active{display:block}

/* ---- cards / layout ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.card h2{display:flex;align-items:center;gap:10px}
.card h2 .spacer{flex:1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
.row>.w2{flex:2 1 260px}.row>.w3{flex:3 1 380px}.row>.auto{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],input[type=email],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,58,.12)}
textarea{min-height:56px;resize:vertical}
input[type=checkbox]{width:16px;height:16px;vertical-align:middle}
.check{display:flex;align-items:center;gap:6px;padding:8px 0}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:#b9c1b8;background:#fafbf9}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#275a30}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.btn.xs{padding:1px 6px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{position:sticky;top:0;background:#f7f8f5;text-align:left;font-weight:650;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #eceee9;vertical-align:middle}
table.t tr:hover td{background:#fafbf8}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:650;background:#f7f8f5;border-top:2px solid var(--line)}
table.t tr.group td{background:#eef2ec;font-weight:650}
table.t tr.sub td{color:var(--muted)}
table.t input,table.t select{padding:4px 6px;min-width:70px}
table.t input[type=number]{width:95px;text-align:right}
table.t td:first-child{white-space:nowrap}
table.t td.actions{white-space:nowrap;text-align:right}
table.t.compact td,table.t.compact th{padding:4px 6px}
.neg{color:var(--red)}.pos{color:var(--green)}

/* ---- badges ---- */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.74rem;font-weight:650;white-space:nowrap}
.tag.ok{background:var(--green-2);color:var(--green)}
.tag.warn{background:var(--amber-2);color:var(--amber)}
.tag.bad{background:var(--red-2);color:var(--red)}
.tag.info{background:var(--blue-2);color:var(--blue)}
.tag.gray{background:#eceee9;color:var(--muted)}
.tag.PEGSA{background:var(--green-2);color:var(--pegsa)}
.tag.GYV{background:var(--blue-2);color:var(--gyv)}
.tag.MERZ{background:var(--amber-2);color:var(--merz)}

/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.kpi .v{font-size:1.45rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}

/* ---- modal ---- */
#modal-bg{position:fixed;inset:0;background:rgba(20,30,22,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
#modal-bg.open{display:flex}
#modal{background:#fff;border-radius:14px;width:100%;max-width:720px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h3{margin-bottom:12px}
#modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ---- toast ---- */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2a1f;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:200;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
#toast.err{background:var(--red)}

/* ---- login ---- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:380px}
#login .box h1{font-size:1.3rem}

/* ---- misc ---- */
.searchbox{position:relative}
.searchbox .dd{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;z-index:20;max-height:220px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.searchbox .dd div{padding:6px 10px;cursor:pointer}
.searchbox .dd div:hover,.searchbox .dd div.sel{background:var(--green-2)}
.searchbox .dd div.add{color:var(--blue);font-weight:600;border-top:1px solid var(--line)}
.note{background:var(--amber-2);border-left:4px solid var(--amber);padding:8px 12px;border-radius:6px;font-size:.86rem;margin:8px 0}
.note.info{background:var(--blue-2);border-color:var(--blue)}
.note.ok{background:var(--green-2);border-color:var(--green)}
.chartbox{position:relative;height:280px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:550;color:var(--muted)}
.subtabs button.active{background:var(--green);border-color:var(--green);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:.85rem;background:#fff}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
details summary{cursor:pointer;font-weight:600;color:var(--muted);padding:4px 0}
.bar{height:8px;background:#eceee9;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.bar>i.over{background:var(--red)}
@media print{#topbar,#tabs,.btn,.noprint{display:none!important}main{padding:0}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="box">
    <h1>Agricultura <span style="color:var(--green)">PEGSA · G&V · Merz</span></h1>
    <p class="muted small">Ingresá con el usuario que te asignaron.</p>
    <label class="f">Email</label><input type="email" id="login-email" autocomplete="username">
    <label class="f" style="margin-top:8px">Contraseña</label><input type="password" id="login-pass" autocomplete="current-password">
    <div id="login-err" class="note hidden" style="margin-top:10px"></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:14px" onclick="Auth.login()">Ingresar</button>
  </div>
</div>

<div id="app" class="hidden">
<div id="topbar">
  <div class="brand">🌱 Agricultura <span>PEGSA · G&V · Merz</span></div>
  <div class="grow"></div>
  <span id="modebadge">modo local</span>
  <select id="sel-campania" onchange="App.setCampania(this.value)"></select>
  <button class="btn sm" onclick="Campanias.nueva()" title="Nueva campaña">+ Campaña</button>
  <button class="btn sm" onclick="Campanias.editar()" title="Configurar campaña">⚙</button>
  <button class="btn sm" id="btn-logout" onclick="Auth.logout()">Salir</button>
</div>
<div id="tabs"></div>
<main id="main"></main>
</div>

<div id="modal-bg" onclick="if(event.target===this)UI.closeModal()"><div id="modal"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN — completar con los datos del proyecto Supabase.
   Si SUPABASE_URL queda vacío la app funciona en MODO LOCAL (datos en
   este navegador solamente), útil para probar.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://fayxwnowyqvdbicncojo.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_CjddpxFPDbwclbS4Ihel4Q_KOFU2qog',
  // fuente alternativa de dólar desde el navegador (BNA oficial venta)
  DOLAR_API: 'https://dolarapi.com/v1/dolares/oficial',
};

const APORTANTES = [
  { id: 'PEGSA', nombre: 'Pecuaria El Garabí' },
  { id: 'GYV',   nombre: 'GVM (G&V Agro)' },
  { id: 'MERZ',  nombre: 'Merz' },
];
const CULTIVOS = ['SOJA', 'MAIZ'];
const CICLOS = ['PRIMERA', 'SEGUNDA'];
const UNIDADES = ['lt', 'kg', 'g', 'bolsa', 'big bag', 'tn', 'un'];
const CATEGORIAS = ['HERBICIDA', 'INSECTICIDA', 'FUNGICIDA', 'COADYUVANTE', 'REGULADOR DE CRECIMIENTO', 'SEMILLA', 'MICROGRANULADO', 'FERTILIZANTE', 'UREA', 'FERT. FOLIAR/ARRANCADOR', 'OTROS'];
const TABLAS_CAMPANIA = ['campos','lotes','precios_mes','ordenes','labores','movimientos_stock','costos_varios','produccion','cosechas'];
const TABLAS_GLOBAL = ['campanias','cotizaciones','insumos','contratistas','tipos_labor'];
const TABLAS_HIJAS = { orden_lotes: 'ordenes', orden_insumos: 'ordenes' };

/* ---------------- utilidades ---------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '—' : 'US$ ' + fmt(v, d);
const ars = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '—' : '$ ' + fmt(v, d);
const pct = (v, d = 1) => (v === null || v === undefined || !isFinite(v)) ? '—' : fmt(v * 100, d) + ' %';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoy = () => new Date().toISOString().slice(0, 10);
const fdate = d => d ? d.split('-').reverse().join('/') : '—';
const mesLabel = m => { if (!m) return ''; const [y, mm] = m.split('-'); return ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][+mm - 1] + ' ' + y; };
const addMonths = (m, n) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? num(f(x)) : num(x)), 0);
const by = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); }); return m; };
const aportanteNombre = id => (APORTANTES.find(a => a.id === id) || {}).nombre || id || '—';
const tagAp = id => id ? `<span class="tag ${esc(id)}">${esc(id)}</span>` : '<span class="tag bad">sin asignar</span>';
const opts = (arr, sel, label = x => x, value = x => x, empty) => (empty !== undefined ? `<option value="">${esc(empty)}</option>` : '') + arr.map(x => `<option value="${esc(value(x))}" ${value(x) == sel ? 'selected' : ''}>${esc(label(x))}</option>`).join('');
const optsAp = (sel, empty) => opts(APORTANTES, sel, a => a.id + ' · ' + a.nombre, a => a.id, empty);

/* =====================================================================
   CAPA DE DATOS — misma API en modo local y en Supabase
   ===================================================================== */
const DB = {
  mode: 'local', sb: null, local: null,
  init() {
    if (this._ready) return; this._ready = true;
    if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase) {
      this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      this.mode = 'supabase';
    } else {
      this.mode = 'local';
      try { this.local = JSON.parse(localStorage.getItem('agri_db') || 'null'); } catch (e) { this.local = null; }
      if (!this.local) { this.local = {}; }
    }
  },
  _tbl(t) { return this.local[t] = this.local[t] || []; },
  _save() { try { localStorage.setItem('agri_db', JSON.stringify(this.local)); } catch (e) { UI.toast('No se pudo guardar localmente: ' + e.message, true); } },
  async select(table, filter = {}) {
    if (this.mode === 'local') {
      return this._tbl(table).filter(r => Object.entries(filter).every(([k, v]) => Array.isArray(v) ? v.includes(r[k]) : r[k] === v)).map(r => ({ ...r }));
    }
    let q = this.sb.from(table).select('*');
    for (const [k, v] of Object.entries(filter)) q = Array.isArray(v) ? q.in(k, v) : q.eq(k, v);
    const { data, error } = await q.limit(5000);
    if (error) throw error;
    return data;
  },
  async insert(table, row) {
    if (!row.id) row.id = uid();
    if (this.mode === 'local') { this._tbl(table).push({ ...row }); this._save(); return row; }
    const { data, error } = await this.sb.from(table).insert(row).select().single();
    if (error) throw error; return data;
  },
  async insertMany(table, rows) {
    rows.forEach(r => { if (!r.id) r.id = uid(); });
    if (!rows.length) return [];
    if (this.mode === 'local') { rows.forEach(r => this._tbl(table).push({ ...r })); this._save(); return rows; }
    const { data, error } = await this.sb.from(table).insert(rows).select();
    if (error) throw error; return data;
  },
  async update(table, id, patch) {
    if (this.mode === 'local') { const r = this._tbl(table).find(x => x.id === id); if (r) Object.assign(r, patch); this._save(); return r; }
    const { data, error } = await this.sb.from(table).update(patch).eq('id', id).select().single();
    if (error) throw error; return data;
  },
  async upsert(table, row, conflict = 'id') {
    if (!row.id) row.id = uid();
    if (this.mode === 'local') {
      const keys = conflict.split(',').map(s => s.trim());
      const t = this._tbl(table); const i = t.findIndex(x => keys.every(k => x[k] === row[k]));
      if (i >= 0) Object.assign(t[i], row, { id: t[i].id }); else t.push({ ...row });
      this._save(); return row;
    }
    const { data, error } = await this.sb.from(table).upsert(row, { onConflict: conflict }).select().single();
    if (error) throw error; return data;
  },
  async remove(table, id) {
    if (this.mode === 'local') {
      const t = this._tbl(table); const i = t.findIndex(x => x.id === id); if (i >= 0) t.splice(i, 1);
      // cascada local
      const cascade = { campanias: ['campos','lotes','precios_mes','ordenes','labores','movimientos_stock','costos_varios','produccion','cosechas'], campos: ['lotes'], lotes: ['produccion','cosechas'], ordenes: ['orden_lotes','orden_insumos','labores'] };
      const fk = { campanias: 'campania_id', campos: 'campo_id', lotes: 'lote_id', ordenes: 'orden_id' }[table];
      (cascade[table] || []).forEach(ct => { this.local[ct] = this._tbl(ct).filter(x => x[fk] !== id); });
      if (table === 'ordenes') this.local.movimientos_stock = this._tbl('movimientos_stock').filter(x => x.orden_id !== id);
      this._save(); return;
    }
    const { error } = await this.sb.from(table).delete().eq('id', id);
    if (error) throw error;
  },
  async removeWhere(table, filter) {
    if (this.mode === 'local') { this.local[table] = this._tbl(table).filter(r => !Object.entries(filter).every(([k, v]) => r[k] === v)); this._save(); return; }
    let q = this.sb.from(table).delete(); for (const [k, v] of Object.entries(filter)) q = q.eq(k, v);
    const { error } = await q; if (error) throw error;
  },
};

/* ---------------- autenticación ---------------- */
const Auth = {
  user: null,
  async init() {
    if (DB.mode === 'local') { this.user = { email: 'local' }; return true; }
    const { data } = await DB.sb.auth.getSession();
    this.user = data.session ? data.session.user : null;
    if (!this._sub) this._sub = DB.sb.auth.onAuthStateChange((_e, s) => { const was = !!this.user; this.user = s ? s.user : null; if (!!this.user !== was) App.boot(); });
    return !!this.user;
  },
  async login() {
    const email = document.getElementById('login-email').value.trim(), password = document.getElementById('login-pass').value;
    const err = document.getElementById('login-err'); err.classList.add('hidden');
    const { error } = await DB.sb.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = 'No se pudo ingresar: ' + error.message; err.classList.remove('hidden'); }
  },
  async logout() { if (DB.mode === 'supabase') await DB.sb.auth.signOut(); else if (confirm('En modo local "Salir" borra TODOS los datos de prueba de este navegador. ¿Continuar?')) { localStorage.removeItem('agri_db'); location.reload(); } },
};

/* ---------------- estado en memoria ---------------- */
const S = { campanias: [], campania: null, cotizaciones: [], insumos: [], contratistas: [], tipos_labor: [],
  campos: [], lotes: [], precios_mes: [], ordenes: [], orden_lotes: [], orden_insumos: [], labores: [],
  movimientos_stock: [], costos_varios: [], produccion: [], cosechas: [] };

const Store = {
  async loadGlobal() {
    for (const t of TABLAS_GLOBAL) S[t] = await DB.select(t);
    S.campanias.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
    S.insumos.sort((a, b) => a.nombre.localeCompare(b.nombre));
    S.contratistas.sort((a, b) => a.nombre.localeCompare(b.nombre));
    S.cotizaciones.sort((a, b) => a.fecha.localeCompare(b.fecha));
  },
  async loadCampania(id) {
    S.campania = S.campanias.find(c => c.id === id) || null;
    if (!S.campania) { TABLAS_CAMPANIA.forEach(t => S[t] = []); S.orden_lotes = []; S.orden_insumos = []; return; }
    for (const t of TABLAS_CAMPANIA) S[t] = await DB.select(t, { campania_id: id });
    const ids = S.ordenes.map(o => o.id);
    S.orden_lotes = ids.length ? await DB.select('orden_lotes', { orden_id: ids }) : [];
    S.orden_insumos = ids.length ? await DB.select('orden_insumos', { orden_id: ids }) : [];
    S.campos.sort((a, b) => a.nombre.localeCompare(b.nombre));
    S.ordenes.sort((a, b) => b.numero - a.numero);
  },
  // helpers de búsqueda
  campo: id => S.campos.find(c => c.id === id),
  lote: id => S.lotes.find(l => l.id === id),
  insumo: id => S.insumos.find(i => i.id === id),
  contratista: id => S.contratistas.find(c => c.id === id),
  orden: id => S.ordenes.find(o => o.id === id),
  lotesDe: campoId => S.lotes.filter(l => l.campo_id === campoId).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), undefined, { numeric: true })),
  loteNombre(id) { const l = this.lote(id); if (!l) return '—'; const c = this.campo(l.campo_id); return (c ? c.nombre + ' · ' : '') + 'L ' + l.nombre; },
  async saveCampania(patch) { Object.assign(S.campania, patch); await DB.update('campanias', S.campania.id, patch); },
};

/* ---------------- UI helpers ---------------- */
const UI = {
  toast(msg, err) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(this._t); this._t = setTimeout(() => t.className = '', err ? 5000 : 2500); },
  modal(html, onOpen) { document.getElementById('modal').innerHTML = html; document.getElementById('modal-bg').classList.add('open'); if (onOpen) onOpen(); const f = document.querySelector('#modal input,#modal select'); if (f) f.focus(); },
  closeModal() { document.getElementById('modal-bg').classList.remove('open'); document.getElementById('modal').style.maxWidth = ''; },
  val(id) { const e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; },
  async run(fn, okMsg) { try { await fn(); if (okMsg) this.toast(okMsg); } catch (e) { console.error(e); this.toast('Error: ' + (e.message || e), true); } },
  /* buscador con alta rápida (para insumos, contratistas) */
  searchbox(id, items, { placeholder = 'Buscar…', onPick, onAdd, value = '' } = {}) {
    return `<div class="searchbox"><input type="text" id="${id}" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off"><div class="dd hidden" id="${id}-dd"></div></div>`;
  },
  bindSearch(id, getItems, { onPick, onAdd, label = x => x.nombre } = {}) {
    const inp = document.getElementById(id), dd = document.getElementById(id + '-dd'); if (!inp) return;
    let sel = -1, list = [];
    const render = () => {
      const q = inp.value.trim().toLowerCase();
      list = getItems().filter(x => !q || label(x).toLowerCase().includes(q)).slice(0, 40);
      let h = list.map((x, i) => `<div data-i="${i}" class="${i === sel ? 'sel' : ''}">${esc(label(x))}</div>`).join('');
      if (onAdd && q && !list.some(x => label(x).toLowerCase() === q)) h += `<div class="add" data-add="1">+ Agregar "${esc(inp.value.trim())}"</div>`;
      dd.innerHTML = h || '<div class="muted">Sin resultados</div>'; dd.classList.remove('hidden');
    };
    inp.addEventListener('focus', render); inp.addEventListener('input', () => { sel = -1; render(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, list.length - 1); render(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (sel >= 0 && list[sel]) pick(list[sel]); else if (list.length === 1) pick(list[0]); else if (onAdd && inp.value.trim()) add(); }
      else if (e.key === 'Escape') dd.classList.add('hidden');
    });
    inp.addEventListener('blur', () => setTimeout(() => dd.classList.add('hidden'), 180));
    dd.addEventListener('mousedown', e => { const d = e.target.closest('div[data-i],div[data-add]'); if (!d) return; e.preventDefault(); if (d.dataset.add) add(); else pick(list[+d.dataset.i]); });
    const pick = x => { inp.value = label(x); dd.classList.add('hidden'); onPick && onPick(x); };
    const add = async () => { const x = await onAdd(inp.value.trim()); if (x) pick(x); };
  },
};

/* ---------------- Campañas ---------------- */
const Campanias = {
  form(c = {}) {
    const pp = c.participacion_pactada || { PEGSA: 60, GYV: 20, MERZ: 20 };
    return `<h3>${c.id ? 'Configurar campaña' : 'Nueva campaña'}</h3>
      <div class="row"><div><label class="f">Nombre</label><input id="c-nombre" value="${esc(c.nombre || '')}" placeholder="2026/27"></div>
      <div><label class="f">Primer mes de alquiler</label><input type="month" id="c-mes" value="${esc(c.mes_inicio || (new Date().getFullYear() + '-05'))}"></div></div>
      <h4 style="margin-top:12px">Participación pactada (%)</h4>
      <div class="row">${APORTANTES.map(a => `<div><label class="f">${esc(a.nombre)}</label><input type="number" id="c-pp-${a.id}" value="${pp[a.id] ?? 0}" step="0.1"></div>`).join('')}</div>
      ${!c.id && S.campanias.length ? `<div class="check" style="margin-top:10px"><input type="checkbox" id="c-copiar" checked><label for="c-copiar">Copiar campos y lotes de la campaña actual (${esc(S.campania ? S.campania.nombre : '')})</label></div>` : ''}
      <div class="foot">${c.id ? `<button class="btn danger" onclick="Campanias.borrar()">Eliminar campaña</button><span style="flex:1"></span>` : ''}<button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Campanias.guardar(${c.id ? 'true' : 'false'})">Guardar</button></div>`;
  },
  nueva() { UI.modal(this.form()); },
  editar() { UI.modal(this.form(S.campania)); },
  async guardar(edit) {
    const pp = {}; APORTANTES.forEach(a => pp[a.id] = num(UI.val('c-pp-' + a.id)));
    const total = sum(Object.values(pp)); if (Math.abs(total - 100) > 0.01) return UI.toast('La participación pactada debe sumar 100 % (suma ' + fmt(total, 1) + ')', true);
    const patch = { nombre: UI.val('c-nombre').trim() || 'Sin nombre', mes_inicio: UI.val('c-mes'), participacion_pactada: pp };
    await UI.run(async () => {
      if (edit) { await Store.saveCampania(patch); }
      else {
        const c = await DB.insert('campanias', { ...patch, activa: true, precios: {}, proyeccion: {}, created_at: new Date().toISOString() });
        if (UI.val('c-copiar') && S.campania) {
          for (const campo of S.campos) {
            const nc = await DB.insert('campos', { campania_id: c.id, nombre: campo.nombre, participa: campo.participa, aportante_alquiler: campo.aportante_alquiler, dueno: campo.dueno, qq_ha: campo.qq_ha, obs: campo.obs || '', plano: campo.plano || null });
            await DB.insertMany('lotes', Store.lotesDe(campo.id).map(l => ({ campania_id: c.id, campo_id: nc.id, nombre: l.nombre, has: l.has, cultivo: l.cultivo, ciclo: l.ciclo, participa: l.participa, obs: '' })));
          }
        }
        await Store.loadGlobal(); localStorage.setItem('agri_campania', c.id); await Store.loadCampania(c.id);
      }
      UI.closeModal(); App.renderCampanias(); App.render();
    }, 'Campaña guardada');
  },
  async borrar() {
    if (!confirm(`¿Eliminar la campaña ${S.campania.nombre} con TODOS sus datos? Esta acción no se puede deshacer.`)) return;
    await UI.run(async () => { await DB.remove('campanias', S.campania.id); localStorage.removeItem('agri_campania'); await Store.loadGlobal(); const c = S.campanias[S.campanias.length - 1]; await Store.loadCampania(c ? c.id : null); UI.closeModal(); App.renderCampanias(); App.render(); }, 'Campaña eliminada');
  },
};
</script>

<script>
/* =====================================================================
   MOTOR DE CÁLCULO — alquiler, costos por lote, resultados, participación
   ===================================================================== */
const Calc = {
  /* ---- cotizaciones / precio del quintal por mes ---- */
  mesesCampania() { const m0 = S.campania.mes_inicio || (new Date().getFullYear() + '-05'); return Array.from({ length: 12 }, (_, i) => addMonths(m0, i)); },
  cotizacionMes(mes) {
    // promedio de los primeros 10 días del mes con datos cargados
    const rows = S.cotizaciones.filter(c => c.fecha.startsWith(mes) && +c.fecha.slice(8, 10) <= 10);
    const soja = rows.filter(r => num(r.soja_ars) > 0), dol = rows.filter(r => num(r.dolar_venta) > 0);
    const soja_ars = soja.length ? sum(soja, r => r.soja_ars) / soja.length : null;
    const dolar = dol.length ? sum(dol, r => r.dolar_venta) / dol.length : null;
    return { soja_ars, dolar, dias: soja.length, qq_usd: soja_ars && dolar ? soja_ars / dolar / 10 : null };
  },
  precioMes(mes) {
    const pm = S.precios_mes.find(p => p.mes === mes);
    if (pm && pm.manual && num(pm.qq_usd) > 0) return { qq_usd: num(pm.qq_usd), soja_ars: pm.soja_ars, dolar: pm.dolar, origen: 'manual' };
    const c = this.cotizacionMes(mes);
    if (c.qq_usd) return { qq_usd: c.qq_usd, soja_ars: c.soja_ars, dolar: c.dolar, origen: 'auto', dias: c.dias };
    return { qq_usd: null, origen: 'pendiente' };
  },
  /* tabla de alquiler de la campaña: por mes, precio y por campo el monto */
  alquiler() {
    const meses = this.mesesCampania();
    const precios = meses.map(m => ({ mes: m, ...this.precioMes(m) }));
    let ultimo = null; precios.forEach(p => { if (p.qq_usd) ultimo = p.qq_usd; });
    // meses sin precio: se estiman con el último precio conocido
    precios.forEach(p => { if (!p.qq_usd) { p.qq_usd_est = ultimo; } });
    const campos = S.campos.map(c => {
      const lotes = Store.lotesDe(c.id), has = sum(lotes, l => l.has), qq = num(c.qq_ha) * has, qq_mes = qq / 12;
      const meses_c = precios.map(p => { const px = p.qq_usd || p.qq_usd_est || 0; return { mes: p.mes, qq: qq_mes, qq_usd: px, usd: qq_mes * px, estimado: !p.qq_usd }; });
      const total = sum(meses_c, m => m.usd), estimados = meses_c.filter(m => m.estimado).length, devengado = sum(meses_c.filter(m => !m.estimado), m => m.usd);
      return { campo: c, has, qq_ha: num(c.qq_ha), qq_total: qq, meses: meses_c, total_usd: total, devengado_usd: devengado, meses_estimados: estimados, usd_ha: has ? total / has : 0 };
    });
    return { meses, precios, campos, total_usd: sum(campos, c => c.total_usd), devengado_usd: sum(campos, c => c.devengado_usd), meses_devengados: precios.filter(p => p.qq_usd).length };
  },

  /* ---- costo de insumos por orden (con precio y aportante de la salida de stock) ---- */
  precioSugerido(insumoId) {
    const compras = S.movimientos_stock.filter(m => m.insumo_id === insumoId && m.cantidad > 0 && num(m.precio_usd) > 0).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    return compras[0] ? { precio: num(compras[0].precio_usd), aportante: compras[0].aportante } : { precio: null, aportante: null };
  },
  stockInsumo(insumoId, campoId) { return sum(S.movimientos_stock.filter(m => m.insumo_id === insumoId && (!campoId || m.campo_id === campoId)), m => m.cantidad); },
  ordenHas(ordenId) { return sum(S.orden_lotes.filter(x => x.orden_id === ordenId), x => x.has); },
  cantidadInsumo(oi, hasOrden) { return oi.modo === 'ha' ? num(oi.dosis) * hasOrden : num(oi.cantidad); },
  costoInsumosOrden(ordenId) {
    const hasO = this.ordenHas(ordenId);
    return S.orden_insumos.filter(x => x.orden_id === ordenId).map(oi => {
      const cant = this.cantidadInsumo(oi, hasO);
      const sal = S.movimientos_stock.find(m => m.orden_insumo_id === oi.id);
      const rem = sal && sal.remito_mov_id ? S.movimientos_stock.find(m => m.id === sal.remito_mov_id) : null;
      const precio = sal && num(sal.precio_usd) > 0 ? num(sal.precio_usd) : (rem && num(rem.precio_usd) > 0 ? num(rem.precio_usd) : null);
      const sug = precio === null ? this.precioSugerido(oi.insumo_id).precio : null;
      const px = precio ?? sug ?? 0;
      return { oi, cantidad: cant, precio, precio_usado: px, estimado: precio === null, aportante: sal ? (sal.aportante || (rem && rem.aportante) || null) : null, usd: cant * px, salida: sal };
    });
  },

  /* ---- costos por lote (todo en USD) ---- */
  lotesCalc(opts = {}) {
    const alq = this.alquiler();
    const precios = S.campania.precios || {};
    const lotes = S.lotes.map(l => {
      const campo = Store.campo(l.campo_id) || {};
      const participa = !!campo.participa && !!l.participa;
      const r = { lote: l, campo, participa, has: num(l.has), cultivo: l.cultivo, aportes: {}, sin_asignar: 0,
        alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0, venta: 0, kg: 0, kg_estimado: false, has_cosechadas: 0, has_picadas: 0, estim: { insumos: 0, cosecha: 0 }, insumos_det: [] };
      const ap = (a, k, v) => { if (!v) return; r[k] += v; if (a) { r.aportes[a] = r.aportes[a] || { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0 }; r.aportes[a][k] += v; } else r.sin_asignar += v; };
      // alquiler
      const ac = alq.campos.find(x => x.campo.id === campo.id);
      if (ac && ac.has) ap(campo.aportante_alquiler, 'alquiler', (opts.alquilerDevengado ? ac.devengado_usd : ac.total_usd) * r.has / ac.has);
      // producción y venta
      const px = precios[l.cultivo] || {};
      S.produccion.filter(p => p.lote_id === l.id).forEach(p => {
        const kg = num(p.kg); r.kg += kg; if (p.estimado || p.tipo === 'picado') r.kg_estimado = true;
        if (p.tipo === 'picado') r.has_picadas += num(p.has); else r.has_cosechadas += num(p.has);
        const precio = num(p.precio_usd_tn) > 0 ? num(p.precio_usd_tn) : num(px.precio_usd_tn);
        const neto = precio * (1 - num(px.gastos_pct) / 100) - num(px.gastos_usd_tn);
        r.venta += kg / 1000 * neto;
      });
      r.precio_neto = num(px.precio_usd_tn) * (1 - num(px.gastos_pct) / 100) - num(px.gastos_usd_tn);
      // cosecha
      S.cosechas.filter(c => c.lote_id === l.id).forEach(c => { const v = num(c.monto_usd); ap(c.aportante, 'cosecha', v); if (c.estimado) r.estim.cosecha += v; });
      // costos varios directos al lote
      S.costos_varios.filter(c => c.lote_id === l.id).forEach(c => ap(c.aportante, 'varios', num(c.monto_usd)));
      return r;
    });
    const L = id => lotes.find(x => x.lote.id === id);
    // insumos y labores vía órdenes
    S.ordenes.forEach(o => {
      const ols = S.orden_lotes.filter(x => x.orden_id === o.id), hasO = sum(ols, x => x.has); if (!hasO) return;
      const ins = this.costoInsumosOrden(o.id);
      ols.forEach(ol => {
        const r = L(ol.lote_id); if (!r) return; const f = num(ol.has) / hasO;
        ins.forEach(i => { const v = i.usd * f; r.insumos += v; if (i.estimado) r.estim.insumos += v; r.insumos_det.push({ orden: o, insumo: Store.insumo(i.oi.insumo_id), cantidad: i.cantidad * f, usd: v, aportante: i.aportante, estimado: i.estimado });
          if (i.aportante) { r.aportes[i.aportante] = r.aportes[i.aportante] || { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0 }; r.aportes[i.aportante].insumos += v; } else r.sin_asignar += v; });
      });
    });
    S.labores.forEach(lb => {
      const ol = S.orden_lotes.find(x => x.id === lb.orden_lote_id); if (!ol) return; const r = L(ol.lote_id); if (!r) return;
      const v = num(lb.monto_usd); if (!v) return; r.labores += v;
      if (lb.aportante) { r.aportes[lb.aportante] = r.aportes[lb.aportante] || { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0 }; r.aportes[lb.aportante].labores += v; } else r.sin_asignar += v;
    });
    // costos varios por campo (distribuidos por has en el campo) y generales (todos los lotes participantes)
    S.costos_varios.filter(c => !c.lote_id).forEach(c => {
      const dest = c.campo_id ? lotes.filter(r => r.lote.campo_id === c.campo_id) : lotes.filter(r => r.participa);
      const hasT = sum(dest, r => r.has); if (!hasT) return;
      dest.forEach(r => { const v = num(c.monto_usd) * r.has / hasT; r.varios += v; if (c.aportante) { r.aportes[c.aportante] = r.aportes[c.aportante] || { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0 }; r.aportes[c.aportante].varios += v; } else r.sin_asignar += v; });
    });
    lotes.forEach(r => {
      r.costo = r.alquiler + r.insumos + r.labores + r.varios + r.cosecha;
      r.costo_pre = r.costo - r.cosecha;
      r.costo_ha = r.has ? r.costo / r.has : 0;
      r.has_prod = r.has_cosechadas + r.has_picadas; r.rinde = r.has_prod ? r.kg / r.has_prod : 0;   // kg/ha sobre has cosechadas/picadas
      r.resultado = r.venta - r.costo;
      r.rinde_indif = r.precio_neto > 0 ? r.costo_ha / r.precio_neto * 10 : null; // qq/ha
      r.alerta_precio = !(r.precio_neto > 0);
    });
    return lotes;
  },
  agrupar(lotes, keyFn, labelFn) {
    const g = by(lotes, keyFn);
    return Object.entries(g).map(([k, arr]) => {
      const r = { key: k, label: labelFn(arr[0]), n: arr.length, has: sum(arr, x => x.has), alquiler: sum(arr, x => x.alquiler), insumos: sum(arr, x => x.insumos), labores: sum(arr, x => x.labores), varios: sum(arr, x => x.varios), cosecha: sum(arr, x => x.cosecha), venta: sum(arr, x => x.venta), kg: sum(arr, x => x.kg), has_prod: sum(arr, x => x.has_prod), kg_estimado: arr.some(x => x.kg_estimado), estim: { insumos: sum(arr, x => x.estim.insumos), cosecha: sum(arr, x => x.estim.cosecha) }, lotes: arr };
      r.costo = r.alquiler + r.insumos + r.labores + r.varios + r.cosecha; r.costo_ha = r.has ? r.costo / r.has : 0; r.rinde = r.has_prod ? r.kg / r.has_prod : 0; r.resultado = r.venta - r.costo;
      const pn = arr[0].precio_neto; const mismo = arr.every(x => x.cultivo === arr[0].cultivo); r.precio_neto = mismo ? pn : null; r.rinde_indif = mismo && pn > 0 ? r.costo_ha / pn * 10 : null; r.cultivo = mismo ? arr[0].cultivo : 'MIXTO';
      return r;
    });
  },
  /* ---- participación ---- */
  participacion() {
    // alquiler DEVENGADO: sólo los meses con cotización cargada (lo aportado hasta hoy), no el año completo estimado
    const lotes = this.lotesCalc({ alquilerDevengado: true });
    const part = lotes.filter(r => r.participa), nopart = lotes.filter(r => !r.participa);
    const rubros = ['alquiler', 'insumos', 'labores', 'varios'];
    const porAp = {}; APORTANTES.forEach(a => porAp[a.id] = { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0, total: 0 });
    let sinAsignar = 0;
    part.forEach(r => { Object.entries(r.aportes).forEach(([a, v]) => { if (!porAp[a]) porAp[a] = { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0, total: 0 }; rubros.forEach(k => porAp[a][k] += v[k]); porAp[a].cosecha += v.cosecha; }); sinAsignar += r.sin_asignar; });
    Object.values(porAp).forEach(v => v.total = rubros.reduce((s, k) => s + v[k], 0));
    const total = sum(Object.values(porAp), v => v.total);
    const pactada = S.campania.participacion_pactada || {};
    const filas = Object.entries(porAp).map(([a, v]) => ({ aportante: a, ...v, pct: total ? v.total / total : 0, pct_pactada: num(pactada[a]) / 100, dif_usd: v.total - total * num(pactada[a]) / 100 }));
    // deudas cruzadas en campos que NO participan: lo aportado por otro socio se lo debe el dueño del campo
    const deudas = [];
    by(nopart, r => r.campo.id) && Object.values(by(nopart, r => r.campo.id)).forEach(arr => {
      const campo = arr[0].campo, dueno = campo.dueno || 'PEGSA';
      const acc = {};
      arr.forEach(r => Object.entries(r.aportes).forEach(([a, v]) => { if (a === dueno) return; acc[a] = acc[a] || { alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0 }; Object.keys(v).forEach(k => acc[a][k] += v[k]); }));
      Object.entries(acc).forEach(([a, v]) => { const t = Object.values(v).reduce((s, x) => s + x, 0); if (t > 0.005) deudas.push({ campo, dueno, acreedor: a, ...v, total: t }); });
    });
    // cosecha: costo a pagar según participación vs. lo pagado
    const cosechaTotal = sum(part, r => r.cosecha);
    const cosechaFilas = filas.map(f => ({ aportante: f.aportante, pagado: porAp[f.aportante].cosecha, corresponde: cosechaTotal * f.pct, dif: porAp[f.aportante].cosecha - cosechaTotal * f.pct }));
    // distribución del cereal según participación
    const kgPorCultivo = {}; CULTIVOS.forEach(c => kgPorCultivo[c] = sum(part.filter(r => r.cultivo === c), r => r.kg));
    // aportes por categoría (insumos por categoría del catálogo; labores por tipo de OT; alquiler; varios)
    const cat = {}; const add = (k, a, v) => { if (!v) return; cat[k] = cat[k] || {}; cat[k][a || 'SIN ASIGNAR'] = (cat[k][a || 'SIN ASIGNAR'] || 0) + v; };
    part.forEach(r => { Object.entries(r.aportes).forEach(([a, v]) => { add('ALQUILER', a, v.alquiler); add('COSTOS VARIOS', a, v.varios); }); if (r.sin_asignar) {} r.insumos_det.forEach(d => add((d.insumo || {}).categoria || 'INSUMOS S/CAT.', d.aportante, d.usd)); });
    S.labores.forEach(lb => { const ol = S.orden_lotes.find(x => x.id === lb.orden_lote_id); const l = ol && Store.lote(ol.lote_id); const c = l && Store.campo(l.campo_id); if (!l || !c || !c.participa || !l.participa) return; const o = Store.orden(lb.orden_id) || {}; add('LABOR ' + (o.tipo_labor || ''), lb.aportante, num(lb.monto_usd)); });
    const categorias = Object.entries(cat).map(([k, v]) => ({ categoria: k, ...v, total: sum(Object.values(v)) })).sort((a, b) => b.total - a.total);
    return { filas, total, sinAsignar, deudas, cosechaTotal, cosechaFilas, kgPorCultivo, nopart, part, categorias };
  },
};
</script>

<script>
/* =====================================================================
   PESTAÑA 1 — CAMPOS, LOTES, ALQUILER Y COTIZACIONES
   ===================================================================== */
Tabs.campos = {
  sub: 'campos',
  render(m) {
    m.innerHTML = `<div class="subtabs">
      <button class="${this.sub === 'campos' ? 'active' : ''}" onclick="Tabs.campos.go('campos')">Campos y lotes</button>
      <button class="${this.sub === 'alquiler' ? 'active' : ''}" onclick="Tabs.campos.go('alquiler')">Alquiler</button>
      <button class="${this.sub === 'cotiz' ? 'active' : ''}" onclick="Tabs.campos.go('cotiz')">Cotizaciones soja / dólar</button>
    </div><div id="sub"></div>`;
    const s = document.getElementById('sub');
    if (this.sub === 'campos') this.renderCampos(s); else if (this.sub === 'alquiler') this.renderAlquiler(s); else this.renderCotiz(s);
  },
  go(s) { this.sub = s; App.render(); },

  /* ---------- campos y lotes ---------- */
  renderCampos(s) {
    const totHas = sum(S.lotes, l => l.has);
    const porCult = {}; CULTIVOS.forEach(c => porCult[c] = sum(S.lotes.filter(l => l.cultivo === c), l => l.has));
    s.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">Campos</div><div class="v">${S.campos.length}</div><div class="s">${S.campos.filter(c => c.participa).length} en sociedad</div></div>
      <div class="kpi"><div class="l">Hectáreas</div><div class="v">${fmt(totHas, 1)}</div><div class="s">${S.lotes.length} lotes</div></div>
      ${CULTIVOS.map(c => `<div class="kpi"><div class="l">${c}</div><div class="v">${fmt(porCult[c], 1)} ha</div><div class="s">1ª ${fmt(sum(S.lotes.filter(l => l.cultivo === c && l.ciclo === 'PRIMERA'), l => l.has), 1)} · 2ª ${fmt(sum(S.lotes.filter(l => l.cultivo === c && l.ciclo === 'SEGUNDA'), l => l.has), 1)}</div></div>`).join('')}
    </div>
    <div class="card"><h2>Campos <span class="spacer"></span><button class="btn primary sm" onclick="Tabs.campos.campoForm()">+ Campo</button></h2>
    ${S.campos.length ? S.campos.map(c => this.campoCard(c)).join('') : '<p class="muted">Todavía no hay campos cargados.</p>'}</div>`;
  },
  campoCard(c) {
    const lotes = Store.lotesDe(c.id), has = sum(lotes, l => l.has);
    return `<div class="card" style="margin:10px 0;background:#fbfcfa">
      <h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${c.plano ? `<a href="#" onclick="Tabs.campos.verPlano('${c.id}');return false" title="Ver plano del campo">🗺️ ${esc(c.nombre)}</a>` : esc(c.nombre)} <span class="muted small">${fmt(has, 1)} ha · ${lotes.length} lotes</span>
        ${c.participa ? '<span class="tag ok">en sociedad</span>' : `<span class="tag bad">NO entra en sociedad · a cargo de ${esc(c.dueno || 'PEGSA')}</span>`}
        <span class="tag gray">alquiler ${fmt(c.qq_ha, 1)} qq/ha · paga ${esc(c.aportante_alquiler || '—')}</span>
        <span class="spacer" style="flex:1"></span>
        <button class="btn sm" onclick="Tabs.campos.loteForm('${c.id}')">+ Lote</button>
        <button class="btn sm" onclick="Tabs.campos.campoForm('${c.id}')">Editar</button>
        <button class="btn sm danger" onclick="Tabs.campos.borrarCampo('${c.id}')">Eliminar</button></h3>
      ${c.obs ? `<p class="muted small">${esc(c.obs)}</p>` : ''}
      ${lotes.length ? `<div class="tablewrap"><table class="t compact"><thead><tr><th>Lote</th><th class="num">Has</th><th>Cultivo</th><th>Ciclo</th><th>Sociedad</th><th>Obs.</th><th></th></tr></thead><tbody>
      ${lotes.map(l => `<tr><td><b>${esc(l.nombre)}</b></td><td class="num">${fmt(l.has, 1)}</td><td>${esc(l.cultivo)}</td><td>${esc(l.ciclo)}</td><td>${c.participa && l.participa ? '<span class="tag ok">sí</span>' : '<span class="tag bad">no</span>'}</td><td class="muted small">${esc(l.obs || '')}</td>
        <td class="actions"><button class="btn xs" onclick="Tabs.campos.loteForm('${c.id}','${l.id}')">Editar</button> <button class="btn xs danger" onclick="Tabs.campos.borrarLote('${l.id}')">✕</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted small">Sin lotes. Agregá el primero con “+ Lote”.</p>'}</div>`;
  },
  campoForm(id) {
    const c = id ? Store.campo(id) : { participa: true, aportante_alquiler: 'PEGSA', dueno: 'PEGSA', qq_ha: 12 };
    UI.modal(`<h3>${id ? 'Editar campo' : 'Nuevo campo'}</h3>
      <div class="row"><div class="w2"><label class="f">Nombre</label><input id="f-nombre" value="${esc(c.nombre || '')}"></div>
      <div><label class="f">Alquiler (qq soja/ha/año)</label><input type="number" step="0.1" id="f-qq" value="${c.qq_ha ?? 0}"></div>
      <div><label class="f">Paga el alquiler</label><select id="f-ap">${optsAp(c.aportante_alquiler)}</select></div></div>
      <div class="row" style="margin-top:8px"><div class="auto"><div class="check"><input type="checkbox" id="f-part" ${c.participa ? 'checked' : ''}><label for="f-part"><b>Entra en la sociedad</b></label></div></div>
      <div><label class="f">Si NO entra, queda a cargo de</label><select id="f-dueno">${optsAp(c.dueno)}</select></div></div>
      <label class="f" style="margin-top:8px">Observaciones</label><textarea id="f-obs">${esc(c.obs || '')}</textarea>
      <label class="f" style="margin-top:8px">Plano / foto del campo</label>
      <div class="row"><div class="w2"><input type="file" id="f-plano" accept="image/*" onchange="Tabs.campos.planoChange(this)"></div><div class="auto" id="f-plano-prev">${c.plano ? `<img src="${c.plano}" style="height:60px;border-radius:6px;border:1px solid var(--line)"> <button class="btn xs danger" onclick="Tabs.campos._plano='';document.getElementById('f-plano-prev').innerHTML='<span class=muted>sin plano</span>'">Quitar</button>` : '<span class="muted">sin plano</span>'}</div></div>
      <div class="foot"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Tabs.campos.guardarCampo('${id || ''}')">Guardar</button></div>`);
    this._plano = c.plano || '';
  },
  _plano: '',
  planoChange(inp) {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => { const max = 1600; const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); this._plano = cv.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url); document.getElementById('f-plano-prev').innerHTML = `<img src="${this._plano}" style="height:60px;border-radius:6px;border:1px solid var(--line)">`; };
    img.src = url;
  },
  verPlano(id) {
    const c = Store.campo(id); if (!c || !c.plano) return UI.toast('Este campo no tiene plano cargado. Se agrega desde Editar.');
    UI.modal(`<h3>${esc(c.nombre)} <span class="muted small">${fmt(sum(Store.lotesDe(c.id), l => l.has), 1)} ha · ${Store.lotesDe(c.id).length} lotes</span></h3><div style="text-align:center"><img src="${c.plano}" style="max-width:100%;max-height:75vh;border-radius:8px"></div><div class="foot"><a class="btn" href="${c.plano}" target="_blank">Abrir en pestaña nueva</a><button class="btn primary" onclick="UI.closeModal()">Cerrar</button></div>`);
    document.getElementById('modal').style.maxWidth = '1100px';
  },
  async guardarCampo(id) {
    const row = { nombre: UI.val('f-nombre').trim().toUpperCase(), qq_ha: num(UI.val('f-qq')), aportante_alquiler: UI.val('f-ap'), participa: UI.val('f-part'), dueno: UI.val('f-dueno'), obs: UI.val('f-obs'), plano: this._plano || null };
    if (!row.nombre) return UI.toast('Falta el nombre del campo', true);
    await UI.run(async () => {
      if (id) { await DB.update('campos', id, row); Object.assign(Store.campo(id), row); }
      else { const r = await DB.insert('campos', { ...row, campania_id: S.campania.id }); S.campos.push(r); S.campos.sort((a, b) => a.nombre.localeCompare(b.nombre)); }
      UI.closeModal(); App.render();
    }, 'Campo guardado');
  },
  async borrarCampo(id) {
    const c = Store.campo(id); if (!confirm(`¿Eliminar el campo ${c.nombre} y sus lotes?`)) return;
    await UI.run(async () => { await DB.remove('campos', id); await Store.loadCampania(S.campania.id); App.render(); }, 'Campo eliminado');
  },
  loteForm(campoId, id) {
    const l = id ? Store.lote(id) : { cultivo: 'SOJA', ciclo: 'PRIMERA', participa: true, has: 0 };
    const c = Store.campo(campoId);
    UI.modal(`<h3>${id ? 'Editar lote' : 'Nuevo lote'} · ${esc(c.nombre)}</h3>
      <div class="row"><div><label class="f">Lote</label><input id="l-nombre" value="${esc(l.nombre || '')}" placeholder="ej. 19-20"></div>
      <div><label class="f">Hectáreas</label><input type="number" step="0.1" id="l-has" value="${l.has ?? 0}"></div>
      <div><label class="f">Cultivo</label><select id="l-cult">${opts(CULTIVOS, l.cultivo)}</select></div>
      <div><label class="f">Ciclo</label><select id="l-ciclo">${opts(CICLOS, l.ciclo, x => x === 'PRIMERA' ? 'De primera' : 'De segunda')}</select></div></div>
      <div class="check" style="margin-top:8px"><input type="checkbox" id="l-part" ${l.participa ? 'checked' : ''} ${c.participa ? '' : 'disabled'}><label for="l-part">Entra en la sociedad ${c.participa ? '' : '<span class="muted">(el campo no entra)</span>'}</label></div>
      <label class="f">Observaciones</label><textarea id="l-obs">${esc(l.obs || '')}</textarea>
      <div class="foot"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Tabs.campos.guardarLote('${campoId}','${id || ''}')">Guardar</button></div>`);
  },
  async guardarLote(campoId, id) {
    const row = { nombre: UI.val('l-nombre').trim(), has: num(UI.val('l-has')), cultivo: UI.val('l-cult'), ciclo: UI.val('l-ciclo'), participa: UI.val('l-part'), obs: UI.val('l-obs') };
    if (!row.nombre) return UI.toast('Falta el nombre del lote', true);
    await UI.run(async () => {
      if (id) { await DB.update('lotes', id, row); Object.assign(Store.lote(id), row); }
      else { const r = await DB.insert('lotes', { ...row, campo_id: campoId, campania_id: S.campania.id }); S.lotes.push(r); }
      UI.closeModal(); App.render();
    }, 'Lote guardado');
  },
  async borrarLote(id) {
    if (!confirm('¿Eliminar el lote?')) return;
    await UI.run(async () => { await DB.remove('lotes', id); S.lotes = S.lotes.filter(l => l.id !== id); App.render(); }, 'Lote eliminado');
  },

  /* ---------- alquiler ---------- */
  renderAlquiler(s) {
    const A = Calc.alquiler();
    const pend = A.precios.filter(p => !p.qq_usd).length;
    s.innerHTML = `<div class="note info">El alquiler se pacta en <b>quintales de soja por hectárea</b>, se divide en 12 meses desde ${mesLabel(S.campania.mes_inicio)} y cada mes se valúa con el <b>promedio de la pizarra Rosario de los primeros 10 días</b> dividido el <b>promedio del dólar BNA divisa venta</b> del mismo período. ${pend ? `<br><b>${pend} mes(es) sin cotización</b>: se estiman con el último precio conocido (celdas en ámbar) hasta que se carguen los datos en “Cotizaciones”.` : ''}</div>
    <div class="kpis"><div class="kpi"><div class="l">Alquiler total campaña</div><div class="v">${usd(A.total_usd)}</div><div class="s">${fmt(sum(A.campos, c => c.qq_total))} qq soja</div></div>
      <div class="kpi"><div class="l">Por mes (promedio)</div><div class="v">${usd(A.total_usd / 12)}</div></div>
      <div class="kpi"><div class="l">Hectáreas alquiladas</div><div class="v">${fmt(sum(A.campos, c => c.has), 1)}</div><div class="s">${usd(sum(A.campos, c => c.has) ? A.total_usd / sum(A.campos, c => c.has) : 0)} / ha</div></div></div>
    <div class="card"><h2>Precio del quintal por mes</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Mes</th><th class="num">Soja $/tn (prom. 1–10)</th><th class="num">Dólar divisa venta</th><th class="num">qq USD</th><th>Origen</th><th></th></tr></thead><tbody>
      ${A.precios.map(p => `<tr><td>${mesLabel(p.mes)}</td><td class="num">${p.soja_ars ? ars(p.soja_ars) : '—'}</td><td class="num">${p.dolar ? fmt(p.dolar, 2) : '—'}</td><td class="num"><b>${p.qq_usd ? usd(p.qq_usd, 2) : (p.qq_usd_est ? `<span class="tag warn">est. ${usd(p.qq_usd_est, 2)}</span>` : '<span class="tag bad">pendiente</span>')}</b></td>
        <td>${p.origen === 'manual' ? '<span class="tag info">manual</span>' : p.origen === 'auto' ? `<span class="tag ok">cotizaciones (${p.dias} días)</span>` : '<span class="tag gray">—</span>'}</td>
        <td class="actions"><button class="btn xs" onclick="Tabs.campos.precioMesForm('${p.mes}')">${p.origen === 'manual' ? 'Editar' : 'Fijar a mano'}</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h2>Alquiler por campo</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Campo</th><th class="num">Has</th><th class="num">qq/ha</th><th class="num">qq total</th><th class="num">qq/mes</th>${A.meses.map(m => `<th class="num">${mesLabel(m)}</th>`).join('')}<th class="num">Total USD</th><th class="num">USD/ha</th></tr></thead><tbody>
      ${A.campos.map(c => `<tr><td><b>${c.campo.plano ? `<a href="#" onclick="Tabs.campos.verPlano('${c.campo.id}');return false">🗺️ ${esc(c.campo.nombre)}</a>` : esc(c.campo.nombre)}</b> ${c.campo.participa ? '' : '<span class="tag bad">no soc.</span>'} ${tagAp(c.campo.aportante_alquiler)}</td><td class="num">${fmt(c.has, 1)}</td><td class="num">${fmt(c.qq_ha, 1)}</td><td class="num">${fmt(c.qq_total)}</td><td class="num">${fmt(c.qq_total / 12, 1)}</td>
        ${c.meses.map(m => `<td class="num ${m.estimado ? 'muted' : ''}" style="${m.estimado ? 'background:var(--amber-2)' : ''}"><div class="small muted">${fmt(m.qq, 1)} qq × ${fmt(m.qq_usd, 2)}</div><b>${fmt(m.usd)}</b></td>`).join('')}<td class="num"><b>${fmt(c.total_usd)}</b></td><td class="num">${fmt(c.usd_ha)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(sum(A.campos, c => c.has), 1)}</td><td></td><td class="num">${fmt(sum(A.campos, c => c.qq_total))}</td><td class="num">${fmt(sum(A.campos, c => c.qq_total) / 12, 1)}</td>
        ${A.meses.map((m, i) => `<td class="num">${fmt(sum(A.campos, c => c.meses[i].usd))}</td>`).join('')}<td class="num">${fmt(A.total_usd)}</td><td></td></tr></tfoot></table></div></div>`;
  },
  precioMesForm(mes) {
    const pm = S.precios_mes.find(p => p.mes === mes) || {}; const c = Calc.cotizacionMes(mes);
    UI.modal(`<h3>Precio del quintal · ${mesLabel(mes)}</h3><p class="muted small">Calculado con cotizaciones: ${c.qq_usd ? usd(c.qq_usd, 2) + ` (soja ${ars(c.soja_ars)} / dólar ${fmt(c.dolar, 2)}, ${c.dias} días)` : 'sin datos'}</p>
      <div class="row"><div><label class="f">Soja $/tn</label><input type="number" id="pm-soja" value="${pm.soja_ars ?? (c.soja_ars ? c.soja_ars.toFixed(0) : '')}" oninput="Tabs.campos.pmCalc()"></div><div><label class="f">Dólar divisa venta</label><input type="number" step="0.01" id="pm-dolar" value="${pm.dolar ?? (c.dolar ? c.dolar.toFixed(2) : '')}" oninput="Tabs.campos.pmCalc()"></div><div><label class="f">qq USD (manual)</label><input type="number" step="0.01" id="pm-qq" value="${pm.qq_usd ?? (c.qq_usd ? c.qq_usd.toFixed(2) : '')}"></div></div>
      <div class="foot">${pm.manual ? `<button class="btn" onclick="Tabs.campos.precioMesAuto('${mes}')">Volver a automático</button><span style="flex:1"></span>` : ''}<button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Tabs.campos.precioMesSave('${mes}')">Guardar</button></div>`);
  },
  pmCalc() { const s = num(UI.val('pm-soja')), d = num(UI.val('pm-dolar')); if (s && d) document.getElementById('pm-qq').value = (s / d / 10).toFixed(2); },
  async precioMesSave(mes) {
    const row = { campania_id: S.campania.id, mes, soja_ars: num(UI.val('pm-soja')) || null, dolar: num(UI.val('pm-dolar')) || null, qq_usd: num(UI.val('pm-qq')), manual: true };
    if (!row.qq_usd) return UI.toast('Falta el precio del quintal', true);
    await UI.run(async () => { const ex = S.precios_mes.find(p => p.mes === mes); if (ex) row.id = ex.id; await DB.upsert('precios_mes', row, 'campania_id,mes'); S.precios_mes = await DB.select('precios_mes', { campania_id: S.campania.id }); UI.closeModal(); App.render(); }, 'Precio guardado');
  },
  async precioMesAuto(mes) { const ex = S.precios_mes.find(p => p.mes === mes); if (ex) await UI.run(async () => { await DB.remove('precios_mes', ex.id); S.precios_mes = S.precios_mes.filter(p => p.id !== ex.id); UI.closeModal(); App.render(); }, 'Vuelve a calcularse con cotizaciones'); },

  /* ---------- cotizaciones ---------- */
  cotFiltro: '',
  renderCotiz(s) {
    const meses = Calc.mesesCampania();
    const rows = S.cotizaciones.filter(c => !this.cotFiltro || c.fecha.startsWith(this.cotFiltro)).slice().reverse().slice(0, 400);
    s.innerHTML = `<div class="grid2">
      <div class="card"><h2>Cargar cotización del día</h2>
        <div class="row"><div><label class="f">Fecha</label><input type="date" id="ct-fecha" value="${hoy()}"></div><div><label class="f">Soja pizarra $/tn</label><input type="number" id="ct-soja" placeholder="ej. 558000"></div><div><label class="f">Dólar BNA divisa venta</label><input type="number" step="0.01" id="ct-dolar" placeholder="ej. 1497.50"></div><div class="auto"><button class="btn primary" onclick="Tabs.campos.cotSave()">Guardar</button></div></div>
        <div class="btn-group" style="margin-top:10px"><button class="btn sm" onclick="Tabs.campos.fetchDolar()">↓ Traer dólar de hoy (dolarapi / BNA)</button></div>
        <p class="muted small" style="margin-top:8px">La pizarra de soja se publica en <a href="https://www.cac.bcr.com.ar/es/precios-de-pizarra" target="_blank">cac.bcr.com.ar</a> y el dólar divisa en <a href="https://www.bna.com.ar" target="_blank">bna.com.ar</a>. El script <code>actualizar_cotizaciones.py</code> puede cargarlos automáticamente todos los días.</p></div>
      <div class="card"><h2>Carga masiva</h2><p class="muted small">Pegá filas con <b>fecha ; soja ; dólar</b> (una por línea; fecha dd/mm/aaaa o aaaa-mm-dd; el dólar es opcional). Se actualizan las fechas existentes.</p>
        <textarea id="ct-bulk" style="min-height:120px" placeholder="05/05/2026;308000;1161&#10;06/05/2026;316500;1171.5"></textarea>
        <div class="btn-group" style="margin-top:8px"><button class="btn primary sm" onclick="Tabs.campos.cotBulk()">Importar</button></div></div>
    </div>
    <div class="card"><h2>Resumen por mes (primeros 10 días) <span class="spacer"></span></h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Mes</th><th class="num">Días con soja</th><th class="num">Soja $/tn prom.</th><th class="num">Dólar prom.</th><th class="num">Soja USD/tn</th><th class="num">qq USD</th></tr></thead><tbody>
      ${meses.map(m => { const c = Calc.cotizacionMes(m); return `<tr><td>${mesLabel(m)}</td><td class="num">${c.dias}</td><td class="num">${c.soja_ars ? ars(c.soja_ars) : '—'}</td><td class="num">${c.dolar ? fmt(c.dolar, 2) : '—'}</td><td class="num">${c.qq_usd ? usd(c.qq_usd * 10, 1) : '—'}</td><td class="num"><b>${c.qq_usd ? usd(c.qq_usd, 2) : '—'}</b></td></tr>`; }).join('')}</tbody></table></div></div>
    <div class="card"><h2>Cotizaciones cargadas <span class="spacer"></span><input type="month" style="width:auto" value="${this.cotFiltro}" onchange="Tabs.campos.cotFiltro=this.value;App.render()"> <span class="muted small">${S.cotizaciones.length} registros</span></h2>
      <div class="tablewrap"><table class="t compact"><thead><tr><th>Fecha</th><th class="num">Soja $/tn</th><th class="num">Dólar divisa venta</th><th class="num">Soja USD/tn</th><th>Fuente</th><th></th></tr></thead><tbody>
      ${rows.map(c => `<tr><td>${fdate(c.fecha)}</td><td class="num">${c.soja_ars ? ars(c.soja_ars) : '—'}</td><td class="num">${c.dolar_venta ? fmt(c.dolar_venta, 2) : '—'}</td><td class="num">${c.soja_ars && c.dolar_venta ? fmt(c.soja_ars / c.dolar_venta, 1) : '—'}</td><td class="muted small">${esc(c.fuente || '')}</td><td class="actions"><button class="btn xs" onclick="Tabs.campos.cotEdit('${c.id}')">Editar</button> <button class="btn xs danger" onclick="Tabs.campos.cotDel('${c.id}')">✕</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">Sin cotizaciones cargadas.</td></tr>'}</tbody></table></div></div>`;
  },
  async cotUpsert(fecha, soja, dolar, fuente = 'manual') {
    const ex = S.cotizaciones.find(c => c.fecha === fecha);
    const row = { fecha, soja_ars: soja || (ex ? ex.soja_ars : null), dolar_venta: dolar || (ex ? ex.dolar_venta : null), fuente };
    if (ex) row.id = ex.id;
    await DB.upsert('cotizaciones', row, 'fecha');
  },
  async cotSave() {
    const fecha = UI.val('ct-fecha'), soja = num(UI.val('ct-soja')), dolar = num(UI.val('ct-dolar'));
    if (!fecha || (!soja && !dolar)) return UI.toast('Cargá fecha y al menos un valor', true);
    await UI.run(async () => { await this.cotUpsert(fecha, soja, dolar); S.cotizaciones = (await DB.select('cotizaciones')).sort((a, b) => a.fecha.localeCompare(b.fecha)); App.render(); }, 'Cotización guardada');
  },
  async cotBulk() {
    const lines = UI.val('ct-bulk').split('\n').map(l => l.trim()).filter(Boolean); let n = 0;
    await UI.run(async () => {
      for (const l of lines) {
        const p = l.split(/[;\t|]/).map(x => x.trim()); if (p.length < 2) continue;
        let f = p[0]; if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(f)) { const [d, m, y] = f.split('/'); f = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(f)) continue;
        const soja = num(p[1].replace(/\./g, '').replace(',', '.')), dolar = p[2] ? num(p[2].replace(',', '.')) : 0;
        if (!soja && !dolar) continue; await this.cotUpsert(f, soja, dolar, 'import'); n++;
      }
      S.cotizaciones = (await DB.select('cotizaciones')).sort((a, b) => a.fecha.localeCompare(b.fecha)); App.render();
    }, `${n} cotizaciones importadas`);
  },
  cotEdit(id) { const c = S.cotizaciones.find(x => x.id === id); this.sub = 'cotiz'; App.render(); document.getElementById('ct-fecha').value = c.fecha; document.getElementById('ct-soja').value = c.soja_ars || ''; document.getElementById('ct-dolar').value = c.dolar_venta || ''; window.scrollTo(0, 0); },
  async cotDel(id) { await UI.run(async () => { await DB.remove('cotizaciones', id); S.cotizaciones = S.cotizaciones.filter(c => c.id !== id); App.render(); }, 'Eliminada'); },
  async fetchDolar() {
    try {
      const r = await fetch(CONFIG.DOLAR_API); const j = await r.json();
      const v = num(j.venta); if (!v) throw new Error('sin valor');
      document.getElementById('ct-dolar').value = v; document.getElementById('ct-fecha').value = (j.fechaActualizacion || '').slice(0, 10) || hoy();
      UI.toast(`Dólar oficial venta: ${fmt(v, 2)} (${j.nombre || 'BNA'}). Revisá que sea el valor divisa y guardá.`);
    } catch (e) { UI.toast('No se pudo consultar el dólar automáticamente; cargalo a mano.', true); }
  },
};
</script>

<script>
/* =====================================================================
   PESTAÑA 2 — ÓRDENES DE TRABAJO
   ===================================================================== */
Tabs.ordenes = {
  draft: null, editId: null, filtro: { campo: '', texto: '' },
  nuevoDraft() { const max = S.ordenes.reduce((m, o) => Math.max(m, num(o.numero)), 0); return { numero: max + 1, fecha: hoy(), tipo_labor: '', contratista_id: '', contratista_nombre: '', obs: '', campos: [], lotes: [], insumos: [] }; },
  render(m) {
    if (!this.draft) this.draft = this.nuevoDraft();
    m.innerHTML = `<div class="card" id="ot-form"></div><div class="card" id="ot-list"></div>`;
    this.renderForm(); this.renderList();
  },
  renderForm() {
    const d = this.draft, box = document.getElementById('ot-form');
    const hasTot = sum(d.lotes, l => l.has);
    box.innerHTML = `<h2>${this.editId ? 'Editar orden N° ' + d.numero : 'Nueva orden de trabajo'} <span class="spacer"></span>${this.editId ? '<button class="btn sm" onclick="Tabs.ordenes.cancelarEdicion()">Cancelar edición</button>' : ''}</h2>
    <div class="row">
      <div class="auto" style="width:90px"><label class="f">N°</label><input type="number" id="ot-num" value="${d.numero}" onchange="Tabs.ordenes.draft.numero=num(this.value)"></div>
      <div class="auto"><label class="f">Fecha</label><input type="date" id="ot-fecha" value="${d.fecha}" onchange="Tabs.ordenes.draft.fecha=this.value"></div>
      <div><label class="f">Tipo de labor</label><select id="ot-tipo" onchange="Tabs.ordenes.tipoChange(this)">${opts(S.tipos_labor.map(t => t.nombre).concat(d.tipo_labor && !S.tipos_labor.some(t => t.nombre === d.tipo_labor) ? [d.tipo_labor] : []), d.tipo_labor, x => x, x => x, '— elegir —')}<option value="__nuevo">+ Nuevo tipo…</option></select></div>
      <div class="w2"><label class="f">Aplicador / contratista</label>${UI.searchbox('ot-aplic', [], { value: d.contratista_nombre, placeholder: 'Buscar… si no está, escribilo y Enter para agregarlo' })}</div>
    </div>
    <div class="grid2" style="margin-top:14px">
      <div><h3>Campos y lotes</h3>
        <div class="chips" style="margin-bottom:8px">${S.campos.map(c => `<span class="chip ${d.campos.includes(c.id) ? 'on' : ''}" onclick="Tabs.ordenes.toggleCampo('${c.id}')">${esc(c.nombre)}</span>`).join('') || '<span class="muted">Primero cargá campos en la pestaña 1.</span>'}</div>
        ${d.campos.length ? `<div class="tablewrap"><table class="t compact"><thead><tr><th></th><th>Campo · Lote</th><th>Cultivo</th><th class="num">Has lote</th><th class="num">Has a trabajar</th><th>Obs.</th></tr></thead><tbody>
        ${d.campos.flatMap(cid => Store.lotesDe(cid).map(l => { const sel = d.lotes.find(x => x.lote_id === l.id); return `<tr><td><input type="checkbox" ${sel ? 'checked' : ''} onchange="Tabs.ordenes.toggleLote('${l.id}',this.checked)"></td><td>${esc(Store.campo(cid).nombre)} · <b>L ${esc(l.nombre)}</b> ${l.participa && Store.campo(cid).participa ? '' : '<span class="tag bad">no soc.</span>'}</td><td class="small">${esc(l.cultivo)} ${l.ciclo === 'SEGUNDA' ? '2ª' : '1ª'}</td><td class="num">${fmt(l.has, 1)}</td>
          <td class="num">${sel ? `<input type="number" step="0.1" value="${sel.has}" onchange="Tabs.ordenes.setLote('${l.id}','has',num(this.value))">` : '—'}</td><td>${sel ? `<input type="text" value="${esc(sel.obs)}" placeholder="obs. del lote" onchange="Tabs.ordenes.setLote('${l.id}','obs',this.value)">` : ''}</td></tr>`; })).join('')}
        </tbody><tfoot><tr><td></td><td>Total</td><td></td><td></td><td class="num">${fmt(hasTot, 1)} ha</td><td></td></tr></tfoot></table></div>` : '<p class="muted small">Elegí uno o más campos para ver sus lotes.</p>'}
      </div>
      <div><h3>Insumos</h3>
        <div class="row"><div class="w2"><label class="f">Buscar insumo (si no existe, se agrega)</label>${UI.searchbox('ot-ins', [], { placeholder: 'Buscar… si no está, escribilo y Enter para agregarlo' })}</div></div>
        ${d.insumos.length ? `<div class="tablewrap" style="margin-top:8px"><table class="t compact"><thead><tr><th>Insumo</th><th>Modo</th><th class="num">Dosis</th><th class="num">Total</th><th>Sale de (depósito)</th><th>Stock</th><th>Obs.</th><th></th></tr></thead><tbody>
        ${d.insumos.map((i, k) => { const tot = i.modo === 'ha' ? num(i.dosis) * hasTot : num(i.cantidad); const dep = i.deposito_id || this.depositoDefault(); const st = Calc.stockInsumo(i.insumo_id, dep || undefined); const stT = Calc.stockInsumo(i.insumo_id); const ok = st >= tot - 1e-9 && tot > 0;
          return `<tr><td><b>${esc(i.nombre)}</b> <span class="muted small">${esc(i.unidad)}</span></td>
          <td><select onchange="Tabs.ordenes.setIns(${k},'modo',this.value)"><option value="ha" ${i.modo === 'ha' ? 'selected' : ''}>por ha</option><option value="total" ${i.modo === 'total' ? 'selected' : ''}>total</option></select></td>
          <td class="num">${i.modo === 'ha' ? `<input type="number" step="0.001" value="${i.dosis}" onchange="Tabs.ordenes.setIns(${k},'dosis',num(this.value))"> /ha` : `<input type="number" step="0.01" value="${i.cantidad}" onchange="Tabs.ordenes.setIns(${k},'cantidad',num(this.value))">`}</td>
          <td class="num"><b>${fmt(tot, 2)}</b> ${esc(i.unidad)}${i.modo === 'total' && hasTot ? `<div class="muted small">${fmt(tot / hasTot, 3)}/ha</div>` : ''}</td>
          <td><select onchange="Tabs.ordenes.setIns(${k},'deposito_id',this.value)">${opts(S.campos, dep, c => c.nombre, c => c.id, '— sin depósito —')}</select></td>
          <td>${tot ? (ok ? `<span class="tag ok">stock ${fmt(st, 1)}</span>` : `<span class="tag bad">sin stock (${fmt(st, 1)}) → queda ${fmt(st - tot, 1)}</span>`) : ''}${stT !== st ? `<div class="muted small">total ${fmt(stT, 1)}</div>` : ''}</td>
          <td><input type="text" value="${esc(i.obs)}" placeholder="obs." onchange="Tabs.ordenes.setIns(${k},'obs',this.value)"></td>
          <td class="actions"><button class="btn xs danger" onclick="Tabs.ordenes.delIns(${k})">✕</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted small" style="margin-top:8px">Sin insumos todavía.</p>'}
      </div>
    </div>
    <div style="margin-top:12px"><label class="f">Observaciones generales de la orden</label><textarea id="ot-obs" onchange="Tabs.ordenes.draft.obs=this.value">${esc(d.obs)}</textarea></div>
    <div class="btn-group" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="Tabs.ordenes.limpiar()">Limpiar</button><button class="btn primary" onclick="Tabs.ordenes.generar()">${this.editId ? 'Guardar cambios y generar PDF' : 'Generar orden + PDF'}</button></div>`;
    UI.bindSearch('ot-aplic', () => S.contratistas.filter(c => c.activo !== false), { onPick: c => { d.contratista_id = c.id; d.contratista_nombre = c.nombre; }, onAdd: async n => { const c = await DB.insert('contratistas', { nombre: n.toUpperCase(), activo: true }); S.contratistas.push(c); S.contratistas.sort((a, b) => a.nombre.localeCompare(b.nombre)); UI.toast('Contratista agregado'); return c; } });
    UI.bindSearch('ot-ins', () => S.insumos.filter(i => i.activo !== false), { onPick: i => { this.addIns(i); document.getElementById('ot-ins').value = ''; }, onAdd: n => this.nuevoInsumo(n) });
  },
  tipoChange(sel) { if (sel.value === '__nuevo') { const n = prompt('Nombre del nuevo tipo de labor:'); if (n) { UI.run(async () => { const t = await DB.insert('tipos_labor', { nombre: n.trim().toUpperCase() }); S.tipos_labor.push(t); this.draft.tipo_labor = t.nombre; this.renderForm(); }); } else { sel.value = this.draft.tipo_labor; } } else this.draft.tipo_labor = sel.value; },
  nuevoInsumo(nombre) {
    return new Promise(res => {
      UI.modal(`<h3>Nuevo insumo</h3><div class="row"><div class="w2"><label class="f">Nombre</label><input id="ni-nombre" value="${esc(nombre.toUpperCase())}"></div><div><label class="f">Unidad</label><select id="ni-unidad">${opts(UNIDADES, 'lt')}</select></div><div><label class="f">Categoría</label><select id="ni-cat">${opts(CATEGORIAS, 'HERBICIDA')}</select></div></div>
        <div class="foot"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" id="ni-ok">Agregar</button></div>`, () => {
        document.getElementById('ni-ok').onclick = async () => { const n = UI.val('ni-nombre').trim().toUpperCase(); if (!n) return; await UI.run(async () => { const i = await DB.insert('insumos', { nombre: n, unidad: UI.val('ni-unidad'), categoria: UI.val('ni-cat'), activo: true }); S.insumos.push(i); S.insumos.sort((a, b) => a.nombre.localeCompare(b.nombre)); UI.closeModal(); this.addIns(i); res(i); }, 'Insumo agregado'); };
      });
    });
  },
  depositoDefault() { const l = this.draft.lotes[0]; return l ? (Store.lote(l.lote_id) || {}).campo_id || '' : ''; },
  addIns(i) { if (this.draft.insumos.some(x => x.insumo_id === i.id)) return UI.toast('Ese insumo ya está en la orden'); this.draft.insumos.push({ insumo_id: i.id, nombre: i.nombre, unidad: i.unidad, modo: 'ha', dosis: 0, cantidad: 0, obs: '', deposito_id: this.depositoDefault() }); this.renderForm(); },
  setIns(k, f, v) { this.draft.insumos[k][f] = v; this.renderForm(); },
  delIns(k) { this.draft.insumos.splice(k, 1); this.renderForm(); },
  toggleCampo(id) { const d = this.draft; if (d.campos.includes(id)) { d.campos = d.campos.filter(x => x !== id); d.lotes = d.lotes.filter(l => Store.lote(l.lote_id).campo_id !== id); } else { d.campos.push(id); Store.lotesDe(id).forEach(l => d.lotes.push({ lote_id: l.id, has: num(l.has), obs: '' })); } this.renderForm(); },
  toggleLote(id, on) { const d = this.draft; if (on) { if (!d.lotes.some(l => l.lote_id === id)) d.lotes.push({ lote_id: id, has: num(Store.lote(id).has), obs: '' }); } else d.lotes = d.lotes.filter(l => l.lote_id !== id); this.renderForm(); },
  setLote(id, f, v) { const l = this.draft.lotes.find(x => x.lote_id === id); if (l) l[f] = v; this.renderForm(); },
  limpiar() { this.draft = this.nuevoDraft(); this.editId = null; this.renderForm(); },
  cancelarEdicion() { this.limpiar(); },

  /* ---- generar / guardar ---- */
  async generar() {
    const d = this.draft;
    if (!d.lotes.length) return UI.toast('Elegí al menos un lote', true);
    if (!d.tipo_labor) return UI.toast('Elegí el tipo de labor', true);
    if (!d.contratista_id) return UI.toast('Elegí el aplicador / contratista', true);
    if (d.insumos.some(i => (i.modo === 'ha' ? num(i.dosis) : num(i.cantidad)) <= 0)) return UI.toast('Hay insumos sin dosis/cantidad', true);
    if (!this.editId && S.ordenes.some(o => num(o.numero) === num(d.numero))) return UI.toast('Ya existe una orden con ese número', true);
    const hasTot = sum(d.lotes, l => l.has);
    const campoSalida = Store.lote(d.lotes[0].lote_id).campo_id;
    await UI.run(async () => {
      let orden;
      const base = { numero: num(d.numero), fecha: d.fecha, tipo_labor: d.tipo_labor, contratista_id: d.contratista_id, obs: d.obs, estado: 'generada' };
      if (this.editId) {
        orden = Store.orden(this.editId); await DB.update('ordenes', orden.id, base); Object.assign(orden, base);
        // lotes: mantener los existentes (con sus labores), borrar los quitados, agregar nuevos
        const exist = S.orden_lotes.filter(x => x.orden_id === orden.id);
        for (const ol of exist) { const nd = d.lotes.find(l => l.lote_id === ol.lote_id); if (!nd) { await DB.remove('orden_lotes', ol.id); await DB.removeWhere('labores', { orden_lote_id: ol.id }); } else { await DB.update('orden_lotes', ol.id, { has: nd.has, obs: nd.obs }); } }
        for (const l of d.lotes) if (!exist.some(x => x.lote_id === l.lote_id)) { const ol = await DB.insert('orden_lotes', { orden_id: orden.id, lote_id: l.lote_id, has: l.has, obs: l.obs }); await DB.insert('labores', { campania_id: S.campania.id, orden_id: orden.id, orden_lote_id: ol.id, contratista_id: d.contratista_id, has_reales: l.has, fecha: d.fecha, aportante: null }); }
        const existI = S.orden_insumos.filter(x => x.orden_id === orden.id);
        for (const oi of existI) { const ni = d.insumos.find(i => i.insumo_id === oi.insumo_id); if (!ni) { await DB.removeWhere('movimientos_stock', { orden_insumo_id: oi.id }); await DB.remove('orden_insumos', oi.id); } else { const cant = ni.modo === 'ha' ? num(ni.dosis) * hasTot : num(ni.cantidad); await DB.update('orden_insumos', oi.id, { modo: ni.modo, dosis: ni.dosis, cantidad: cant, unidad: ni.unidad, obs: ni.obs }); const mv = S.movimientos_stock.find(m => m.orden_insumo_id === oi.id); if (mv) await DB.update('movimientos_stock', mv.id, { cantidad: -cant, fecha: d.fecha, campo_id: ni.deposito_id || campoSalida }); } }
        for (const i of d.insumos) if (!existI.some(x => x.insumo_id === i.insumo_id)) await this.insertInsumo(orden, i, hasTot, campoSalida);
      } else {
        orden = await DB.insert('ordenes', { ...base, campania_id: S.campania.id, created_at: new Date().toISOString() });
        for (const l of d.lotes) { const ol = await DB.insert('orden_lotes', { orden_id: orden.id, lote_id: l.lote_id, has: l.has, obs: l.obs }); await DB.insert('labores', { campania_id: S.campania.id, orden_id: orden.id, orden_lote_id: ol.id, contratista_id: d.contratista_id, has_reales: l.has, fecha: d.fecha, aportante: null }); }
        for (const i of d.insumos) await this.insertInsumo(orden, i, hasTot, campoSalida);
      }
      await Store.loadCampania(S.campania.id);
      this.limpiar(); this.renderList();
      PDF.orden(orden.id);
    }, this.editId ? 'Orden actualizada' : 'Orden generada');
  },
  async insertInsumo(orden, i, hasTot, campoSalida) {
    const cant = i.modo === 'ha' ? num(i.dosis) * hasTot : num(i.cantidad);
    const oi = await DB.insert('orden_insumos', { orden_id: orden.id, insumo_id: i.insumo_id, modo: i.modo, dosis: i.dosis, cantidad: cant, unidad: i.unidad, obs: i.obs });
    // salida de stock (queda pendiente de precio/aportante → pestaña 4)
    await DB.insert('movimientos_stock', { campania_id: S.campania.id, fecha: orden.fecha, tipo: 'salida', insumo_id: i.insumo_id, cantidad: -cant, precio_usd: null, aportante: null, campo_id: i.deposito_id || campoSalida, orden_id: orden.id, orden_insumo_id: oi.id, facturado: false, obs: 'OT N° ' + orden.numero, created_at: new Date().toISOString() });
  },

  /* ---- listado ---- */
  renderList() {
    const box = document.getElementById('ot-list'); const f = this.filtro;
    let list = S.ordenes.slice();
