      <div class="tablewrap"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Tipo</th><th>Campos · lotes</th><th class="num">Has</th><th>Aplicador</th><th>Insumos</th><th class="num">Costo USD</th><th>Estado</th><th></th></tr></thead><tbody>
      ${list.map(o => { const ols = S.orden_lotes.filter(x => x.orden_id === o.id), ois = S.orden_insumos.filter(x => x.orden_id === o.id); const labs = S.labores.filter(l => l.orden_id === o.id); const fact = labs.length && labs.every(l => l.factura); const pend = S.movimientos_stock.filter(m => m.orden_id === o.id && !m.facturado).length;
        const campos = [...new Set(ols.map(ol => (Store.campo((Store.lote(ol.lote_id) || {}).campo_id) || {}).nombre))].join(', ');
        return `<tr><td><b>${o.numero}</b></td><td class="nowrap">${fdate(o.fecha)}</td><td>${esc(o.tipo_labor)}</td><td><b>${esc(campos)}</b><div class="muted small">${ols.map(ol => 'L ' + esc((Store.lote(ol.lote_id) || {}).nombre) + ' (' + fmt(ol.has, 1) + ')').join(' · ')}</div></td><td class="num">${fmt(sum(ols, x => x.has), 1)}</td><td>${esc((Store.contratista(o.contratista_id) || {}).nombre || '—')}</td>
        <td class="small">${ois.map(oi => esc((Store.insumo(oi.insumo_id) || {}).nombre) + ' ' + fmt(oi.cantidad, 1) + ' ' + esc(oi.unidad || '')).join('<br>')}</td>
        <td class="num">${(() => { const cs = Calc.costoInsumosOrden(o.id); const t = sum(cs, c => c.usd), lab = sum(labs, l => l.monto_usd); return t || lab ? `<b>${fmt(t + lab)}</b><div class="muted small">ins. ${fmt(t)}${cs.some(c => c.estimado) ? '*' : ''} · lab. ${fmt(lab)}</div>` : ''; })()}</td>
        <td>${fact ? '<span class="tag ok">facturada</span>' : '<span class="tag warn">labor s/facturar</span>'} ${pend ? `<span class="tag warn">${pend} insumo(s) s/precio</span>` : ''}</td>
        <td class="actions"><button class="btn xs" onclick="PDF.orden('${o.id}')">PDF</button> <button class="btn xs" onclick="Tabs.ordenes.editar('${o.id}')">Editar</button> <button class="btn xs danger" onclick="Tabs.ordenes.eliminar('${o.id}')">✕</button></td></tr>`; }).join('') || '<tr><td colspan="10" class="muted">No hay órdenes.</td></tr>'}</tbody></table></div><p class="muted small">* insumos valuados a precio sugerido (falta precio en Stock).</p>`;
  },
  editar(id) {
    const o = Store.orden(id); const ols = S.orden_lotes.filter(x => x.orden_id === id), ois = S.orden_insumos.filter(x => x.orden_id === id); const hasTot = sum(ols, x => x.has);
    this.editId = id;
    this.draft = { numero: o.numero, fecha: o.fecha, tipo_labor: o.tipo_labor, contratista_id: o.contratista_id, contratista_nombre: (Store.contratista(o.contratista_id) || {}).nombre || '', obs: o.obs || '',
      campos: [...new Set(ols.map(ol => (Store.lote(ol.lote_id) || {}).campo_id).filter(Boolean))], lotes: ols.map(ol => ({ lote_id: ol.lote_id, has: num(ol.has), obs: ol.obs || '' })),
      insumos: ois.map(oi => { const i = Store.insumo(oi.insumo_id) || {}; const mv = S.movimientos_stock.find(m => m.orden_insumo_id === oi.id); return { insumo_id: oi.insumo_id, nombre: i.nombre, unidad: oi.unidad || i.unidad, modo: oi.modo, dosis: num(oi.dosis), cantidad: num(oi.cantidad), obs: oi.obs || '', deposito_id: mv ? mv.campo_id : '' }; }) };

    await UI.run(async () => { await DB.removeWhere('movimientos_stock', { orden_id: id }); await DB.remove('ordenes', id); await Store.loadCampania(S.campania.id); if (this.editId === id) this.limpiar(); App.render(); }, 'Orden eliminada');
  },

/* =====================================================================
   PDF DE LA ORDEN
   ===================================================================== */
const PDF = {
  orden(id) {
    const o = Store.orden(id); if (!o) return;
    const ols = S.orden_lotes.filter(x => x.orden_id === id), ois = S.orden_insumos.filter(x => x.orden_id === id), hasTot = sum(ols, x => x.has);
    const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
    const W = 297, M = 8; const G = [47, 107, 58];
    const campos = [...new Set(ols.map(ol => (Store.campo((Store.lote(ol.lote_id) || {}).campo_id) || {}).nombre))].join(' / ');
    const cultivos = [...new Set(ols.map(ol => (Store.lote(ol.lote_id) || {}).cultivo))].join(' / ');
    const resp = (Store.contratista(o.contratista_id) || {}).nombre || '';
    // ---- encabezado (3 bloques como la planilla) ----
    doc.setDrawColor(60); doc.setLineWidth(0.3);
    doc.autoTable({ startY: M, margin: { left: M, right: M }, theme: 'grid', styles: { fontSize: 9, cellPadding: 1.6, lineColor: [80, 80, 80], lineWidth: 0.25, textColor: 20 },
      body: [
        [{ content: 'Firma', styles: { fontStyle: 'bold', cellWidth: 22 } }, { content: '', styles: { cellWidth: 50 } }, { content: campos, rowSpan: 3, styles: { fontStyle: 'bold', fontSize: 16, halign: 'center', valign: 'middle', cellWidth: 70 } }, { content: 'ORDEN de TRABAJO N° ' + o.numero, rowSpan: 3, styles: { fontStyle: 'bold', fontSize: 13, halign: 'center', valign: 'middle', cellWidth: 60, fillColor: [230, 241, 232] } }, { content: 'Cultivo', styles: { fontStyle: 'bold', cellWidth: 26 } }, { content: cultivos }],
        [{ content: 'Campo', styles: { fontStyle: 'bold' } }, { content: campos }, { content: 'Labor', styles: { fontStyle: 'bold' } }, { content: o.tipo_labor || '' }],
        [{ content: 'Fecha', styles: { fontStyle: 'bold' } }, { content: fdate(o.fecha) }, { content: 'Responsable', styles: { fontStyle: 'bold' } }, { content: resp }],
      ] });
    let y = doc.lastAutoTable.finalY + 4;
    // ---- cuerpo: por lote, teórico | real ----
    const body = [];
    ols.forEach(ol => {
      const l = Store.lote(ol.lote_id) || {}; const has = num(ol.has);
      const rows = ois.length ? ois : [null];
      rows.forEach((oi, k) => {
        const i = oi ? (Store.insumo(oi.insumo_id) || {}) : {};
        const dosis = oi ? (oi.modo === 'ha' ? num(oi.dosis) : (hasTot ? num(oi.cantidad) / hasTot : 0)) : 0;
        const row = [];
        if (k === 0) { row.push({ content: 'LOTE ' + (l.nombre || ''), rowSpan: rows.length, styles: { fontStyle: 'bold', fontSize: 13, halign: 'center', valign: 'middle' } }, { content: (l.cultivo || '') + (l.ciclo === 'SEGUNDA' ? ' 2ª' : ''), rowSpan: rows.length, styles: { fontStyle: 'bold', fontSize: 11, halign: 'center', valign: 'middle' } }, { content: fmt(has, 1), rowSpan: rows.length, styles: { fontStyle: 'bold', fontSize: 12, halign: 'center', valign: 'middle' } }); }
        row.push(oi ? i.nombre || '' : '', oi ? fmt(dosis, 3) : '', oi ? fmt(dosis * has, 2) : '', oi ? (oi.unidad || i.unidad || '') : '', '', '', '', '', '', '');
        body.push(row);
      });
      if (ol.obs) body.push([{ content: 'Obs.: ' + ol.obs, colSpan: 13, styles: { fontStyle: 'italic', fontSize: 8, textColor: 90 } }]);
    });
    doc.autoTable({ startY: y, margin: { left: M, right: M }, theme: 'grid', styles: { fontSize: 9, cellPadding: 1.4, lineColor: [80, 80, 80], lineWidth: 0.25, textColor: 20, minCellHeight: 6 },
      head: [[{ content: '', colSpan: 3 }, { content: 'TEÓRICO', colSpan: 4, styles: { halign: 'center' } }, { content: 'REAL', colSpan: 6, styles: { halign: 'center' } }],
             ['Lote', 'Cultivo', 'Has', 'Producto', 'Dosis/ha', 'Cantidad', 'Un', 'Has', 'Fecha', 'Dosis/ha', 'Cantidad', 'Un', 'Factura']],
      body, headStyles: { fillColor: [235, 238, 233], textColor: 20, fontStyle: 'bold', halign: 'center', lineColor: [80, 80, 80], lineWidth: 0.25 },
      columnStyles: { 0: { cellWidth: 26 }, 1: { cellWidth: 22 }, 2: { cellWidth: 20 }, 3: { cellWidth: 50 }, 4: { cellWidth: 16, halign: 'right' }, 5: { cellWidth: 20, halign: 'right' }, 6: { cellWidth: 9 }, 7: { cellWidth: 14, fillColor: [245, 245, 245] }, 8: { cellWidth: 20, fillColor: [245, 245, 245] }, 9: { cellWidth: 16, fillColor: [245, 245, 245] }, 10: { cellWidth: 20, fillColor: [245, 245, 245] }, 11: { cellWidth: 9, fillColor: [245, 245, 245] }, 12: { cellWidth: 'auto', fillColor: [245, 245, 245] } } });
    y = doc.lastAutoTable.finalY + 4;
    // ---- resumen de productos ----
    doc.autoTable({ startY: y, margin: { left: M, right: M }, theme: 'grid', styles: { fontSize: 9, cellPadding: 1.4, lineColor: [80, 80, 80], lineWidth: 0.25, textColor: 20, minCellHeight: 6 },
      head: [['PRODUCTO', 'CANTIDAD TEÓRICA', 'Un', 'CANTIDAD REAL', 'Depósito de salida']],
      body: ois.length ? ois.map(oi => { const i = Store.insumo(oi.insumo_id) || {}; const mv = S.movimientos_stock.find(m => m.orden_insumo_id === oi.id); return [i.nombre || '', fmt(oi.cantidad, 2), oi.unidad || i.unidad || '', '', (Store.campo(mv && mv.campo_id) || {}).nombre || '']; }) : [['— sin insumos —', '', '', '', '']],
      headStyles: { fillColor: [235, 238, 233], textColor: 20, fontStyle: 'bold', lineColor: [80, 80, 80], lineWidth: 0.25 }, columnStyles: { 0: { cellWidth: 90 }, 1: { cellWidth: 40, halign: 'right', fillColor: [235, 235, 235] }, 2: { cellWidth: 12 }, 3: { cellWidth: 50 }, 4: { cellWidth: 'auto' } } });
    y = doc.lastAutoTable.finalY + 5;
    if (o.obs) { if (y > 185) { doc.addPage(); y = M; } doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('Observaciones:', M, y); doc.setFont('helvetica', 'normal'); const lines = doc.splitTextToSize(o.obs, W - 2 * M - 30); doc.text(lines, M + 28, y); y += lines.length * 4.5 + 2; }
    doc.setFontSize(7); doc.setTextColor(120); doc.text('Agricultura PEGSA · G&V · Merz — Campaña ' + S.campania.nombre + ' — generado ' + new Date().toLocaleString('es-AR'), M, 205);
    doc.save(`OT_${String(o.numero).padStart(3, '0')}_${S.campania.nombre.replace('/', '-')}.pdf`);
  },
};
</script>

<script>
/* =====================================================================
   PESTAÑA 3 — LABORES (facturación de las órdenes)
   ===================================================================== */
Tabs.labores = {
  filtro: { estado: 'todas', campo: '' },
  tcSugerido(fecha) { if (!fecha) return null; const c = S.cotizaciones.filter(x => x.fecha <= fecha && num(x.dolar_venta) > 0).pop(); return c ? num(c.dolar_venta) : null; },
  rows() {
    return S.labores.map(lb => { const ol = S.orden_lotes.find(x => x.id === lb.orden_lote_id) || {}; const o = Store.orden(lb.orden_id) || {}; const l = Store.lote(ol.lote_id) || {}; const c = Store.campo(l.campo_id) || {}; return { lb, ol, o, l, c }; })
      .filter(r => r.o.id).sort((a, b) => (b.o.numero - a.o.numero) || String(a.l.nombre).localeCompare(String(b.l.nombre), undefined, { numeric: true }));
  },
  render(m) {
    let rows = this.rows(); const f = this.filtro;
    const total = sum(rows, r => r.lb.monto_usd), pend = rows.filter(r => !r.lb.factura).length;
    if (f.estado === 'pendientes') rows = rows.filter(r => !r.lb.factura); if (f.estado === 'facturadas') rows = rows.filter(r => r.lb.factura);
    if (f.campo) rows = rows.filter(r => r.c.id === f.campo);
    m.innerHTML = `<div class="kpis"><div class="kpi"><div class="l">Labores (USD)</div><div class="v">${usd(total)}</div><div class="s">${S.labores.length} líneas</div></div>
      <div class="kpi"><div class="l">Sin facturar</div><div class="v ${pend ? 'neg' : 'pos'}">${pend}</div><div class="s">líneas pendientes</div></div>
      ${APORTANTES.map(a => `<div class="kpi"><div class="l">${esc(a.id)}</div><div class="v">${usd(sum(S.labores.filter(l => l.aportante === a.id), l => l.monto_usd))}</div></div>`).join('')}</div>
    <div class="note info">Cada lote de cada orden aparece como una línea. Completá <b>aplicador real, has aplicadas, precio/ha, tipo de cambio, factura y quién la paga</b>. El monto en USD se calcula (has × precio ÷ TC) o se puede escribir directo. Con “→ toda la orden” copiás precio, TC, factura y aportante al resto de los lotes de esa orden.</div>
    <div class="card"><h2>Labores <span class="spacer"></span>
      <select style="width:auto" onchange="Tabs.labores.filtro.estado=this.value;App.render()">${opts(['todas', 'pendientes', 'facturadas'], f.estado)}</select>
      <select style="width:auto" onchange="Tabs.labores.filtro.campo=this.value;App.render()">${opts(S.campos, f.campo, c => c.nombre, c => c.id, 'Todos los campos')}</select></h2>
      <div class="tablewrap"><table class="t compact"><thead><tr><th>OT</th><th>Fecha</th><th>Campo · Lote</th><th>Tipo</th><th>Aplicador</th><th class="num">Has OT</th><th class="num">Has reales</th><th class="num">$/ha</th><th class="num">TC</th><th class="num">USD</th><th>Factura</th><th>Paga</th><th>Obs.</th><th></th></tr></thead><tbody>
      ${rows.map(r => { const lb = r.lb; return `<tr id="lb-${lb.id}" style="${lb.factura ? '' : 'background:#fffdf7'}"><td><b>${r.o.numero}</b></td><td><input type="date" style="width:130px" value="${lb.fecha || r.o.fecha || ''}" onchange="Tabs.labores.set('${lb.id}','fecha',this.value)"></td>
        <td class="nowrap">${esc(r.c.nombre)} · <b>L ${esc(r.l.nombre)}</b> ${r.c.participa && r.l.participa ? '' : '<span class="tag bad">no soc.</span>'}</td><td class="small">${esc(r.o.tipo_labor)}</td>
        <td><select onchange="Tabs.labores.contratista('${lb.id}',this)">${opts(S.contratistas, lb.contratista_id, c => c.nombre, c => c.id, '—')}<option value="__nuevo">+ Agregar contratista…</option></select></td>
        <td class="num">${fmt(r.ol.has, 1)}</td><td class="num"><input type="number" step="0.1" value="${lb.has_reales ?? r.ol.has}" onchange="Tabs.labores.set('${lb.id}','has_reales',num(this.value))"></td>
        <td class="num"><input type="number" step="0.01" value="${lb.precio_ha_ars ?? ''}" onchange="Tabs.labores.set('${lb.id}','precio_ha_ars',num(this.value))"></td>
        <td class="num"><input type="number" step="0.01" value="${lb.tc ?? ''}" placeholder="${this.tcSugerido(lb.fecha || r.o.fecha) || ''}" onchange="Tabs.labores.set('${lb.id}','tc',num(this.value))"></td>
        <td class="num"><input type="number" step="0.01" value="${lb.monto_usd != null ? Number(lb.monto_usd).toFixed(2) : ''}" onchange="Tabs.labores.set('${lb.id}','monto_usd',num(this.value))"></td>
        <td><input type="text" style="width:110px" value="${esc(lb.factura || '')}" placeholder="N° factura" onchange="Tabs.labores.set('${lb.id}','factura',this.value)"></td>
        <td><select onchange="Tabs.labores.set('${lb.id}','aportante',this.value)">${optsAp(lb.aportante, '—')}</select></td>
        <td><input type="text" style="width:120px" value="${esc(lb.obs || '')}" onchange="Tabs.labores.set('${lb.id}','obs',this.value)"></td>
        <td class="actions"><button class="btn xs" title="Copiar precio, TC, factura, aportante y aplicador a todos los lotes de la orden" onclick="Tabs.labores.aplicarOrden('${lb.id}')">→ toda la orden</button></td></tr>`; }).join('') || '<tr><td colspan="14" class="muted">No hay labores. Se generan automáticamente al crear órdenes de trabajo.</td></tr>'}
      </tbody><tfoot><tr><td colspan="6">Total</td><td class="num">${fmt(sum(rows, r => r.lb.has_reales ?? r.ol.has), 1)}</td><td></td><td></td><td class="num">${fmt(sum(rows, r => r.lb.monto_usd))}</td><td colspan="4"></td></tr></tfoot></table></div></div>`;
  },
  async contratista(id, sel) {
    if (sel.value !== '__nuevo') return this.set(id, 'contratista_id', sel.value);
    const n = prompt('Nombre del nuevo contratista / tercero:'); if (!n) { App.render(); return; }
    await UI.run(async () => { const c = await DB.insert('contratistas', { nombre: n.trim().toUpperCase(), activo: true }); S.contratistas.push(c); S.contratistas.sort((a, b) => a.nombre.localeCompare(b.nombre)); await this.set(id, 'contratista_id', c.id); }, 'Contratista agregado');
  },
  async set(id, f, v) {
    const lb = S.labores.find(x => x.id === id); const patch = { [f]: v === '' ? null : v };
    if (f === 'fecha' && !lb.tc) { const tc = this.tcSugerido(v); if (tc) patch.tc = tc; }
    Object.assign(lb, patch);
    if (f !== 'monto_usd' && f !== 'factura' && f !== 'aportante' && f !== 'obs' && f !== 'contratista_id') {
      const tc = num(lb.tc) || this.tcSugerido(lb.fecha); if (num(lb.precio_ha_ars) && tc) { patch.monto_usd = Math.round(num(lb.has_reales) * num(lb.precio_ha_ars) / tc * 100) / 100; if (!lb.tc) patch.tc = tc; Object.assign(lb, patch); }
    }
    await UI.run(async () => { await DB.update('labores', id, patch); App.render(); });
  },
  async aplicarOrden(id) {
    const src = S.labores.find(x => x.id === id); const sib = S.labores.filter(x => x.orden_id === src.orden_id && x.id !== id);
    await UI.run(async () => {
      for (const lb of sib) { const patch = { precio_ha_ars: src.precio_ha_ars, tc: src.tc, factura: src.factura, aportante: src.aportante, contratista_id: src.contratista_id, fecha: src.fecha }; if (num(src.precio_ha_ars) && num(src.tc)) patch.monto_usd = Math.round(num(lb.has_reales) * num(src.precio_ha_ars) / num(src.tc) * 100) / 100; Object.assign(lb, patch); await DB.update('labores', lb.id, patch); }
      App.render();
    }, `Aplicado a ${sib.length} lote(s) de la orden`);
  },
};
</script>

<script>
/* =====================================================================
   PESTAÑA 4 — STOCK DE INSUMOS
   ===================================================================== */
Tabs.stock = {
  sub: 'pend', mvFiltro: '',
  render(m) {
    const pend = S.movimientos_stock.filter(x => x.tipo === 'salida' && !x.facturado);
    m.innerHTML = `<div class="subtabs"><button class="${this.sub === 'pend' ? 'active' : ''}" onclick="Tabs.stock.go('pend')">Pendientes de facturar / remitir ${pend.length ? `<span class="tag bad">${pend.length}</span>` : ''}</button><button class="${this.sub === 'compras' ? 'active' : ''}" onclick="Tabs.stock.go('compras')">Cargar remito / compra / stock inicial</button><button class="${this.sub === 'stock' ? 'active' : ''}" onclick="Tabs.stock.go('stock')">Stock actual</button><button class="${this.sub === 'mov' ? 'active' : ''}" onclick="Tabs.stock.go('mov')">Movimientos</button></div><div id="sub"></div>`;
    const s = document.getElementById('sub');
    ({ pend: this.renderPend, compras: this.renderCompras, stock: this.renderStock, mov: this.renderMov })[this.sub].call(this, s);
  },
  go(s) { this.sub = s; App.render(); },

  /* ---- remitos cargados: cuánto se usó y cuánto queda ---- */
  remitoUso(mv) { const usada = sum(S.movimientos_stock.filter(x => x.remito_mov_id === mv.id), x => -x.cantidad); return { usada, restante: num(mv.cantidad) - usada }; },
  remitosAbiertos(insumoId) { return S.movimientos_stock.filter(m => m.cantidad > 0 && (!insumoId || m.insumo_id === insumoId) && this.remitoUso(m).restante > 1e-6).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '')); },
  remitoLabel(m) { const u = this.remitoUso(m); return `Rem. ${m.remito || 's/n'} · ${fdate(m.fecha)} · ${m.aportante || '—'} · ${(Store.campo(m.campo_id) || {}).nombre || 'sin dep.'} · quedan ${fmt(u.restante, 1)}`; },

  /* ---- pendientes de facturar / remitir ---- */
  renderPend(s) {
    const pend = S.movimientos_stock.filter(x => x.tipo === 'salida' && !x.facturado);
    const g = by(pend, x => x.campo_id || '');
    s.innerHTML = `<div class="note info">Cada insumo usado en una orden aparece acá hasta que se le asigne de dónde salió: <b>un remito ya cargado</b> (se le descuenta a ese remito y toma su precio, aportante y factura) o un <b>remito/aportante nuevo</b>. No hace falta tener precio ni factura: se pueden completar después desde <b>Movimientos</b> (Editar). Si el remito nuevo trae más cantidad que la usada, el sobrante queda en el depósito.</div>
    ${pend.length ? `<div class="btn-group" style="margin-bottom:10px"><button class="btn primary sm" onclick="Tabs.stock.confirmarTodos()">Confirmar todos los que tengan datos</button></div>` : ''}
    ${Object.entries(g).map(([cid, arr]) => `<div class="card"><h3>Depósito ${esc((Store.campo(cid) || { nombre: 'sin asignar' }).nombre)} <span class="muted small">${arr.length} ítems</span></h3>
      <div class="tablewrap"><table class="t compact"><thead><tr><th>OT</th><th>Fecha</th><th>Insumo</th><th class="num">Usado</th><th>Remito ya cargado</th><th>Aportante</th><th class="num">Precio USD</th><th>Remito nuevo</th><th>Factura</th><th class="num">Cant. remitida</th><th></th></tr></thead><tbody>
      ${arr.map(mv => { const i = Store.insumo(mv.insumo_id) || {}; const o = Store.orden(mv.orden_id) || {}; const sug = Calc.precioSugerido(mv.insumo_id); const px = mv.precio_usd ?? ''; const ap = mv.aportante || ''; const rems = this.remitosAbiertos(mv.insumo_id);
        return `<tr data-id="${mv.id}"><td><b>${o.numero || '—'}</b></td><td>${fdate(mv.fecha)}</td><td><b>${esc(i.nombre)}</b> <span class="muted small">${esc(i.unidad)}</span></td><td class="num">${fmt(-mv.cantidad, 2)}</td>
        <td><select class="p-rm" onchange="Tabs.stock.pendRemito(this)"><option value="">— remito nuevo / sin remito —</option>${rems.map(r => `<option value="${r.id}">${esc(this.remitoLabel(r))}</option>`).join('')}</select></td>
        <td><select class="p-ap">${optsAp(ap, '—')}</select></td>
        <td class="num"><input type="number" step="0.01" class="p-precio" value="${px}" placeholder="${sug.precio ? 'sug. ' + sug.precio : ''}"></td>
        <td><input type="text" class="p-rem" style="width:90px" value="${esc(mv.remito || '')}"></td><td><input type="text" class="p-fac" style="width:90px" value="${esc(mv.factura || '')}" placeholder="opcional"></td>
        <td class="num"><input type="number" step="0.01" class="p-cant" value="${-mv.cantidad}"></td>
        <td class="actions"><button class="btn xs primary" onclick="Tabs.stock.confirmarUno('${mv.id}')">Confirmar</button></td></tr>`; }).join('')}</tbody></table></div></div>`).join('') || '<div class="card"><p class="muted">No hay insumos pendientes de facturar o remitir. 🎉</p></div>'}`;
  },
  pendRemito(sel) {
    const tr = sel.closest('tr'); const r = S.movimientos_stock.find(x => x.id === sel.value);
    const set = (cls, v, dis) => { const e = tr.querySelector(cls); e.value = v; e.disabled = dis; };
    if (r) { set('.p-ap', r.aportante || '', true); set('.p-precio', r.precio_usd ?? '', true); set('.p-rem', r.remito || '', true); set('.p-fac', r.factura || '', true); set('.p-cant', -num(S.movimientos_stock.find(x => x.id === tr.dataset.id).cantidad), true); }
    else { ['.p-ap', '.p-precio', '.p-rem', '.p-fac', '.p-cant'].forEach(c => tr.querySelector(c).disabled = false); }
  },
  async confirmar(id, silent) {
    const tr = document.querySelector(`tr[data-id="${id}"]`); const mv = S.movimientos_stock.find(x => x.id === id); const usado = -mv.cantidad;
    const rmId = tr.querySelector('.p-rm').value;
    if (rmId) {
      const r = S.movimientos_stock.find(x => x.id === rmId); const u = this.remitoUso(r);
      if (u.restante < usado - 1e-6 && !silent && !confirm(`Al remito ${r.remito || ''} le quedan ${fmt(u.restante, 1)} y la orden usó ${fmt(usado, 1)}. ¿Descontar igual?`)) return false;
      await DB.update('movimientos_stock', id, { remito_mov_id: rmId, precio_usd: r.precio_usd ?? null, aportante: r.aportante || null, remito: r.remito || '', factura: r.factura || '', facturado: true });
      return true;
    }
    const precio = num(tr.querySelector('.p-precio').value), ap = tr.querySelector('.p-ap').value, rem = tr.querySelector('.p-rem').value.trim(), fac = tr.querySelector('.p-fac').value.trim(), cant = num(tr.querySelector('.p-cant').value);
    if (!ap) { if (!silent) UI.toast('Elegí el aportante (quién puso el insumo) o un remito ya cargado', true); return false; }
    await DB.update('movimientos_stock', id, { precio_usd: precio || null, aportante: ap, remito: rem, factura: fac, facturado: true, remito_mov_id: null });
    if (cant > usado + 1e-9) await DB.insert('movimientos_stock', { campania_id: S.campania.id, fecha: mv.fecha, tipo: 'compra', insumo_id: mv.insumo_id, cantidad: cant - usado, precio_usd: precio || null, remito: rem, factura: fac, aportante: ap, campo_id: mv.campo_id, facturado: true, obs: 'Sobrante remito (OT ' + ((Store.orden(mv.orden_id) || {}).numero || '') + ')', created_at: new Date().toISOString() });
    return true;
  },
  async confirmarUno(id) { await UI.run(async () => { if (await this.confirmar(id)) { S.movimientos_stock = await DB.select('movimientos_stock', { campania_id: S.campania.id }); App.render(); UI.toast('Confirmado'); } }); },
  async confirmarTodos() {
    const ids = S.movimientos_stock.filter(x => x.tipo === 'salida' && !x.facturado).map(x => x.id); let n = 0;
    await UI.run(async () => { for (const id of ids) if (await this.confirmar(id, true)) n++; S.movimientos_stock = await DB.select('movimientos_stock', { campania_id: S.campania.id }); App.render(); }, `${n} ítems confirmados`);
  },

  /* ---- compras / remitos ---- */
  renderCompras(s) {
    s.innerHTML = `<div class="card"><h2>Cargar movimiento</h2>
      <div class="row"><div class="auto"><label class="f">Tipo</label><select id="mv-tipo"><option value="compra">Compra / remito</option><option value="inicial">Stock inicial</option><option value="ajuste">Ajuste (+/−)</option></select></div>
      <div class="auto"><label class="f">Fecha</label><input type="date" id="mv-fecha" value="${hoy()}"></div>
      <div class="w2"><label class="f">Insumo</label>${UI.searchbox('mv-ins', [])}<input type="hidden" id="mv-ins-id"></div>
      <div><label class="f">Cantidad</label><input type="number" step="0.01" id="mv-cant"></div>
      <div><label class="f">Precio unit. USD</label><input type="number" step="0.01" id="mv-precio"></div></div>
      <div class="row" style="margin-top:8px"><div><label class="f">Aportante (quién lo paga)</label><select id="mv-ap">${optsAp('GYV')}</select></div><div><label class="f">Depósito / campo</label><select id="mv-campo">${opts(S.campos, '', c => c.nombre, c => c.id, '— sin asignar —')}</select></div>
      <div><label class="f">N° remito</label><input type="text" id="mv-rem"></div><div><label class="f">N° factura</label><input type="text" id="mv-fac"></div><div><label class="f">Proveedor</label><input type="text" id="mv-prov" placeholder="G Y V AGRO"></div></div>
      <div class="row" style="margin-top:8px"><div class="w3"><label class="f">Observaciones</label><input type="text" id="mv-obs"></div><div class="auto"><button class="btn primary" onclick="Tabs.stock.guardarMov()">Guardar</button></div></div>
      <p class="muted small" style="margin-top:8px">Un remito con varios productos se carga como varias líneas (mismo N° de remito). Los insumos así cargados quedan en depósito hasta que una orden les dé salida. El precio y la factura son opcionales: se pueden completar después.</p></div>
    <div class="card"><h2>Remitos abiertos (todavía no usados por completo)</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Fecha</th><th>Remito</th><th>Insumo</th><th class="num">Cantidad</th><th class="num">Usado en OT</th><th class="num">Queda</th><th>Depósito</th><th>Aportante</th><th class="num">Precio USD</th><th>Factura</th><th>Proveedor</th><th></th></tr></thead><tbody>
      ${this.remitosAbiertos().map(m => { const i = Store.insumo(m.insumo_id) || {}; const u = this.remitoUso(m); return `<tr><td class="nowrap">${fdate(m.fecha)}</td><td><b>${esc(m.remito || 's/n')}</b> <span class="tag gray">${m.tipo}</span></td><td>${esc(i.nombre)} <span class="muted small">${esc(i.unidad)}</span></td><td class="num">${fmt(m.cantidad, 2)}</td><td class="num">${fmt(u.usada, 2)}</td><td class="num"><b>${fmt(u.restante, 2)}</b></td><td class="small">${esc((Store.campo(m.campo_id) || {}).nombre || '—')}</td><td>${tagAp(m.aportante)}</td><td class="num">${m.precio_usd ? fmt(m.precio_usd, 2) : '<span class="tag warn">s/precio</span>'}</td><td>${esc(m.factura || '') || '<span class="muted">—</span>'}</td><td class="small">${esc(m.proveedor || '')}</td><td class="actions"><button class="btn xs" onclick="Tabs.stock.editarMov('${m.id}')">Editar</button> <button class="btn xs danger" onclick="Tabs.stock.borrarMov('${m.id}')">✕</button></td></tr>`; }).join('') || '<tr><td colspan="12" class="muted">No hay remitos abiertos. Los remitos usados por completo quedan en Movimientos.</td></tr>'}</tbody></table></div>
      <p class="muted small">"Usado en OT" suma las salidas de órdenes que se vincularon a este remito desde Pendientes. Cuando queda en cero, el remito se considera cerrado y sólo aparece en Movimientos.</p></div>`;
    UI.bindSearch('mv-ins', () => S.insumos, { onPick: i => { document.getElementById('mv-ins-id').value = i.id; }, onAdd: async n => { const i = await Tabs.ordenes.nuevoInsumo(n); return i; } });
  },
  async guardarMov(editId) {
    const insId = UI.val('mv-ins-id'); const cant = num(UI.val('mv-cant'));
    if (!insId) return UI.toast('Elegí el insumo', true); if (!cant) return UI.toast('Falta la cantidad', true);
    const row = { campania_id: S.campania.id, fecha: UI.val('mv-fecha'), tipo: UI.val('mv-tipo'), insumo_id: insId, cantidad: cant, precio_usd: num(UI.val('mv-precio')) || null, aportante: UI.val('mv-ap') || null, campo_id: UI.val('mv-campo') || null, remito: UI.val('mv-rem'), factura: UI.val('mv-fac'), proveedor: UI.val('mv-prov'), obs: UI.val('mv-obs'), facturado: true };
    await UI.run(async () => { if (editId) { await DB.update('movimientos_stock', editId, row); UI.closeModal(); } else await DB.insert('movimientos_stock', { ...row, created_at: new Date().toISOString() }); S.movimientos_stock = await DB.select('movimientos_stock', { campania_id: S.campania.id }); App.render(); }, 'Movimiento guardado');
  },
  editarMov(id) {
    const mv = S.movimientos_stock.find(x => x.id === id); const i = Store.insumo(mv.insumo_id) || {};
    UI.modal(`<h3>Editar movimiento</h3><p class="muted small">Acá se completan después el precio y la factura.</p>
      <div class="row"><div class="auto"><label class="f">Tipo</label><select id="mv-tipo">${opts(['compra', 'inicial', 'ajuste', 'salida'], mv.tipo)}</select></div><div class="auto"><label class="f">Fecha</label><input type="date" id="mv-fecha" value="${mv.fecha || ''}"></div>
      <div class="w2"><label class="f">Insumo</label>${UI.searchbox('mv-ins', [], { value: i.nombre || '' })}<input type="hidden" id="mv-ins-id" value="${mv.insumo_id}"></div><div><label class="f">Cantidad (− sale)</label><input type="number" step="0.01" id="mv-cant" value="${mv.cantidad}"></div><div><label class="f">Precio USD</label><input type="number" step="0.01" id="mv-precio" value="${mv.precio_usd ?? ''}"></div></div>
      <div class="row" style="margin-top:8px"><div><label class="f">Aportante</label><select id="mv-ap">${optsAp(mv.aportante, '—')}</select></div><div><label class="f">Depósito / campo</label><select id="mv-campo">${opts(S.campos, mv.campo_id, c => c.nombre, c => c.id, '—')}</select></div><div><label class="f">Remito</label><input type="text" id="mv-rem" value="${esc(mv.remito || '')}"></div><div><label class="f">Factura</label><input type="text" id="mv-fac" value="${esc(mv.factura || '')}"></div><div><label class="f">Proveedor</label><input type="text" id="mv-prov" value="${esc(mv.proveedor || '')}"></div></div>
      <div class="row" style="margin-top:8px"><div class="w3"><label class="f">Obs.</label><input type="text" id="mv-obs" value="${esc(mv.obs || '')}"></div></div>
      <div class="foot"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Tabs.stock.guardarMov('${id}')">Guardar</button></div>`, () => UI.bindSearch('mv-ins', () => S.insumos, { onPick: x => document.getElementById('mv-ins-id').value = x.id }));
  },
  async borrarMov(id) {
    const mv = S.movimientos_stock.find(x => x.id === id); if (mv.orden_id && !confirm('Este movimiento es la salida de una orden de trabajo. Si lo borrás, el insumo de la orden deja de descontar stock y de costear. ¿Continuar?')) return; else if (!mv.orden_id && !confirm('¿Eliminar el movimiento?')) return;
    await UI.run(async () => { await DB.remove('movimientos_stock', id); S.movimientos_stock = S.movimientos_stock.filter(x => x.id !== id); App.render(); }, 'Eliminado');
  },

  /* ---- stock actual ---- */
  renderStock(s) {
    const ins = [...new Set(S.movimientos_stock.map(m => m.insumo_id))].map(id => Store.insumo(id)).filter(Boolean).sort((a, b) => a.nombre.localeCompare(b.nombre));
    const campos = S.campos;
    let valor = 0;
    const rows = ins.map(i => { const tot = Calc.stockInsumo(i.id); const px = Calc.precioSugerido(i.id).precio; const val = tot > 0 && px ? tot * px : 0; valor += val; return { i, tot, px, val, porCampo: campos.map(c => Calc.stockInsumo(i.id, c.id)), sinCampo: sum(S.movimientos_stock.filter(m => m.insumo_id === i.id && !m.campo_id), m => m.cantidad) }; });
    s.innerHTML = `<div class="kpis"><div class="kpi"><div class="l">Valor del stock</div><div class="v">${usd(valor)}</div><div class="s">a último precio de compra</div></div><div class="kpi"><div class="l">Insumos con stock negativo</div><div class="v ${rows.some(r => r.tot < -1e-6) ? 'neg' : ''}">${rows.filter(r => r.tot < -1e-6).length}</div><div class="s">usados sin remito cargado</div></div></div>
    <div class="card"><h2>Stock por insumo y depósito</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Insumo</th><th>Un.</th>${campos.map(c => `<th class="num">${esc(c.nombre)}</th>`).join('')}<th class="num">Sin dep.</th><th class="num">Total</th><th class="num">Últ. precio</th><th class="num">Valor USD</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${esc(r.i.nombre)}</b></td><td class="small">${esc(r.i.unidad)}</td>${r.porCampo.map(v => `<td class="num ${v < -1e-6 ? 'neg' : ''}">${Math.abs(v) > 1e-6 ? fmt(v, 2) : ''}</td>`).join('')}<td class="num ${r.sinCampo < -1e-6 ? 'neg' : ''}">${Math.abs(r.sinCampo) > 1e-6 ? fmt(r.sinCampo, 2) : ''}</td><td class="num"><b class="${r.tot < -1e-6 ? 'neg' : ''}">${fmt(r.tot, 2)}</b></td><td class="num">${r.px ? usd(r.px, 2) : '—'}</td><td class="num">${r.val ? usd(r.val) : ''}</td></tr>`).join('') || `<tr><td colspan="${campos.length + 6}" class="muted">Sin movimientos de stock.</td></tr>`}</tbody></table></div></div>`;
  },

  /* ---- movimientos ---- */
  renderMov(s) {
    let rows = S.movimientos_stock.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.created_at || '').localeCompare(a.created_at || ''));
    if (this.mvFiltro) { const q = this.mvFiltro.toLowerCase(); rows = rows.filter(m => ((Store.insumo(m.insumo_id) || {}).nombre || '').toLowerCase().includes(q) || (m.remito || '').toLowerCase().includes(q) || (m.factura || '').toLowerCase().includes(q) || (m.proveedor || '').toLowerCase().includes(q)); }
    s.innerHTML = `<div class="card"><h2>Movimientos <span class="muted small">${rows.length}</span><span class="spacer"></span><input type="text" style="width:220px" placeholder="buscar insumo / remito / factura" value="${esc(this.mvFiltro)}" oninput="Tabs.stock.mvFiltro=this.value;App.render()"></h2>
      <div class="tablewrap"><table class="t compact"><thead><tr><th>Fecha</th><th>Tipo</th><th>Insumo</th><th class="num">Cantidad</th><th class="num">Precio USD</th><th class="num">Total USD</th><th>Aportante</th><th>Depósito</th><th>Remito</th><th>Factura</th><th>Proveedor / OT</th><th></th></tr></thead><tbody>
      ${rows.map(m => { const i = Store.insumo(m.insumo_id) || {}; const o = m.orden_id ? Store.orden(m.orden_id) : null; return `<tr><td class="nowrap">${fdate(m.fecha)}</td><td><span class="tag ${m.tipo === 'salida' ? 'warn' : m.tipo === 'inicial' ? 'info' : 'ok'}">${m.tipo}</span>${m.tipo === 'salida' && !m.facturado ? ' <span class="tag bad">pendiente</span>' : ''}${m.facturado && m.precio_usd == null ? ' <span class="tag warn">s/precio</span>' : ''}</td><td><b>${esc(i.nombre)}</b> <span class="muted small">${esc(i.unidad)}</span></td><td class="num ${m.cantidad < 0 ? 'neg' : ''}">${fmt(m.cantidad, 2)}</td><td class="num">${m.precio_usd ? fmt(m.precio_usd, 2) : '—'}</td><td class="num">${m.precio_usd ? fmt(Math.abs(m.cantidad) * m.precio_usd) : '—'}</td><td>${tagAp(m.aportante)}</td><td class="small">${esc((Store.campo(m.campo_id) || {}).nombre || '—')}</td><td>${esc(m.remito || '')}${m.remito_mov_id ? ' <span class="tag info" title="descuenta de un remito cargado">vinc.</span>' : ''}</td><td>${esc(m.factura || '')}</td><td class="small">${o ? 'OT ' + o.numero : esc(m.proveedor || '')} ${m.obs && !o ? '<span class="muted">' + esc(m.obs) + '</span>' : ''}</td>
        <td class="actions"><button class="btn xs" onclick="Tabs.stock.editarMov('${m.id}')">Editar</button> <button class="btn xs danger" onclick="Tabs.stock.borrarMov('${m.id}')">✕</button></td></tr>`; }).join('') || '<tr><td colspan="12" class="muted">Sin movimientos.</td></tr>'}</tbody></table></div></div>`;
  },
};
</script>

<script>
/* =====================================================================
   PESTAÑA 5 — COSTOS VARIOS
   ===================================================================== */
Tabs.costos = {
  render(m) {
    const rows = S.costos_varios.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    m.innerHTML = `<div class="note info">Costos que no vienen de una orden de trabajo: honorarios del agrónomo, análisis de suelo, seguros, etc. Si se asignan a un <b>lote</b> van a ese lote; si se asignan a un <b>campo</b> se reparten entre sus lotes por hectárea; si no se asigna nada se reparten entre <b>todos los lotes que participan</b> de la sociedad.</div>
    <div class="card"><h2>Cargar costo</h2>
      <div class="row"><div class="auto"><label class="f">Fecha</label><input type="date" id="cv-fecha" value="${hoy()}"></div><div class="w2"><label class="f">Concepto</label><input type="text" id="cv-conc" placeholder="Honorarios agrónomo, análisis de suelo…"></div>
      <div><label class="f">Campo</label><select id="cv-campo" onchange="Tabs.costos.campoChange()">${opts(S.campos, '', c => c.nombre, c => c.id, 'Toda la agricultura')}</select></div><div><label class="f">Lote</label><select id="cv-lote"><option value="">Todo el campo</option></select></div></div>
      <div class="row" style="margin-top:8px"><div><label class="f">Monto $</label><input type="number" step="0.01" id="cv-ars" oninput="Tabs.costos.calc()"></div><div><label class="f">TC</label><input type="number" step="0.01" id="cv-tc" oninput="Tabs.costos.calc()"></div><div><label class="f">Monto USD</label><input type="number" step="0.01" id="cv-usd"></div>
      <div><label class="f">Aportante</label><select id="cv-ap">${optsAp('PEGSA')}</select></div><div><label class="f">Factura</label><input type="text" id="cv-fac"></div><div class="w2"><label class="f">Obs.</label><input type="text" id="cv-obs"></div><div class="auto"><button class="btn primary" onclick="Tabs.costos.guardar()">Guardar</button></div></div></div>
    <div class="card"><h2>Costos cargados <span class="spacer"></span><span class="muted small">Total ${usd(sum(rows, r => r.monto_usd))}</span></h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Fecha</th><th>Concepto</th><th>Asignado a</th><th class="num">$</th><th class="num">TC</th><th class="num">USD</th><th>Aportante</th><th>Factura</th><th>Obs.</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="nowrap">${fdate(r.fecha)}</td><td><b>${esc(r.concepto)}</b></td><td>${r.lote_id ? esc(Store.loteNombre(r.lote_id)) : r.campo_id ? esc((Store.campo(r.campo_id) || {}).nombre) + ' (todo el campo)' : '<span class="tag info">toda la agricultura</span>'}</td><td class="num">${r.monto_ars ? fmt(r.monto_ars) : ''}</td><td class="num">${r.tc ? fmt(r.tc, 2) : ''}</td><td class="num"><b>${fmt(r.monto_usd)}</b></td><td>${tagAp(r.aportante)}</td><td>${esc(r.factura || '')}</td><td class="small muted">${esc(r.obs || '')}</td><td class="actions"><button class="btn xs" onclick="Tabs.costos.editar('${r.id}')">Editar</button> <button class="btn xs danger" onclick="Tabs.costos.borrar('${r.id}')">✕</button></td></tr>`).join('') || '<tr><td colspan="10" class="muted">Sin costos varios.</td></tr>'}</tbody></table></div></div>`;
  },

      <div class="row" style="margin-top:8px"><div class="w3"><label class="f">Obs.</label><input type="text" id="cv-obs" value="${esc(r.obs || '')}"></div></div>

Tabs.produccion = {
  filtro: { campo: '', lote: '', cultivo: '' },
  filtroUI(tab) { const f = this.filtro; return `<span class="spacer"></span><select style="width:auto" onchange="Tabs.${tab}.filtro.campo=this.value;Tabs.${tab}.filtro.lote='';App.render()">${opts(S.campos, f.campo, c => c.nombre, c => c.id, 'Todos los campos')}</select><select style="width:auto" onchange="Tabs.${tab}.filtro.lote=this.value;App.render()">${opts(f.campo ? Store.lotesDe(f.campo) : S.lotes, f.lote, l => 'L ' + l.nombre + (f.campo ? '' : ' · ' + (Store.campo(l.campo_id) || {}).nombre), l => l.id, 'Todos los lotes')}</select><select style="width:auto" onchange="Tabs.${tab}.filtro.cultivo=this.value;App.render()">${opts(CULTIVOS, f.cultivo, x => x, x => x, 'Todos los cultivos')}</select>`; },
  aplicarFiltro(L) { const f = this.filtro; return L.filter(r => (!f.campo || r.campo.id === f.campo) && (!f.lote || r.lote.id === f.lote) && (!f.cultivo || r.cultivo === f.cultivo)); },
  render(m) {
    const P = S.campania.precios || {};
    const L = Calc.lotesCalc();
    m.innerHTML = `<div class="card"><h2>Precio del cereal y gastos de comercialización</h2><div class="row">
      ${CULTIVOS.map(c => { const p = P[c] || {}; const neto = num(p.precio_usd_tn) * (1 - num(p.gastos_pct) / 100) - num(p.gastos_usd_tn); return `<div class="w2"><div class="card" style="margin:0"><h3>${c}</h3><div class="row"><div><label class="f">Precio USD/tn</label><input type="number" step="0.01" id="px-${c}-precio" value="${p.precio_usd_tn ?? ''}"></div><div><label class="f">Gastos com. %</label><input type="number" step="0.01" id="px-${c}-pct" value="${p.gastos_pct ?? ''}"></div><div><label class="f">Gastos USD/tn</label><input type="number" step="0.01" id="px-${c}-usd" value="${p.gastos_usd_tn ?? ''}"></div></div><p class="muted small" style="margin:6px 0 0">Neto: <b>${usd(neto, 2)}/tn</b> · ${usd(neto / 10, 2)}/qq</p></div></div>`; }).join('')}
      <div class="auto"><button class="btn primary" onclick="Tabs.produccion.guardarPrecios()">Guardar precios</button></div></div>
      <p class="muted small" style="margin-top:8px">Este precio neto se usa para valuar la producción de todos los lotes (se puede pisar por lote) y para el rinde de indiferencia.</p></div>
    <div class="kpis">${CULTIVOS.map(c => { const arr = L.filter(r => r.cultivo === c); const kg = sum(arr, r => r.kg), has = sum(arr, r => r.has_cosechadas + r.has_picadas); return `<div class="kpi"><div class="l">${c}</div><div class="v">${fmt(kg / 1000, 1)} tn</div><div class="s">${fmt(has, 1)} ha cosechadas/picadas de ${fmt(sum(arr, r => r.has), 1)} · rinde ${has ? fmt(kg / has / 100, 1) : '—'} qq/ha</div></div>`; }).join('')}<div class="kpi"><div class="l">Valor producción</div><div class="v">${usd(sum(L, r => r.venta))}</div><div class="s">a precio neto</div></div></div>
    <div class="card"><h2>Producción por lote ${this.filtroUI('produccion')}</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Campo · Lote</th><th>Cultivo</th><th class="num">Has</th><th class="num">Has cosech.</th><th class="num">Has picadas</th><th class="num">Kg</th><th class="num">Rinde qq/ha</th><th class="num">Valor USD</th><th>Detalle</th><th></th></tr></thead><tbody>
      ${this.aplicarFiltro(L).sort((a, b) => a.campo.nombre.localeCompare(b.campo.nombre) || String(a.lote.nombre).localeCompare(String(b.lote.nombre), undefined, { numeric: true })).map(r => { const prods = S.produccion.filter(p => p.lote_id === r.lote.id); const pendHas = r.has - r.has_cosechadas - r.has_picadas;
        return `<tr><td><b>${esc(r.campo.nombre)} · L ${esc(r.lote.nombre)}</b> ${r.participa ? '' : '<span class="tag bad">no soc.</span>'}</td><td class="small">${r.cultivo} ${r.lote.ciclo === 'SEGUNDA' ? '2ª' : '1ª'}</td><td class="num">${fmt(r.has, 1)}</td><td class="num">${fmt(r.has_cosechadas, 1)}</td><td class="num">${r.has_picadas ? fmt(r.has_picadas, 1) : ''}</td><td class="num"><b>${fmt(r.kg)}</b>${r.kg_estimado ? ' <span class="tag warn">est.</span>' : ''}</td><td class="num">${r.kg ? fmt(r.rinde / 100, 1) : '—'}</td><td class="num">${r.kg ? fmt(r.venta) : ''}</td>
        <td class="small">${prods.map(p => `<div>${p.tipo === 'picado' ? '🌽 picado' : '🚜 cosecha'} ${fmt(p.has, 1)} ha · ${fmt(p.kg)} kg${p.estimado ? ' (estimado)' : ''}${p.precio_usd_tn ? ' · ' + usd(p.precio_usd_tn) + '/tn' : ''} ${p.fecha ? '· ' + fdate(p.fecha) : ''} <button class="btn xs" onclick="Tabs.produccion.form('${r.lote.id}','${p.id}')">✎</button> <button class="btn xs danger" onclick="Tabs.produccion.borrar('${p.id}')">✕</button></div>`).join('')}${pendHas > 0.05 && prods.length ? `<div class="muted">faltan ${fmt(pendHas, 1)} ha</div>` : ''}</td>
        <td class="actions"><button class="btn xs primary" onclick="Tabs.produccion.form('${r.lote.id}')">+ Cargar</button></td></tr>`; }).join('') || '<tr><td colspan="10" class="muted">Sin lotes.</td></tr>'}</tbody></table></div></div>`;
  },
  async guardarPrecios() { const P = {}; CULTIVOS.forEach(c => P[c] = { precio_usd_tn: num(UI.val(`px-${c}-precio`)), gastos_pct: num(UI.val(`px-${c}-pct`)), gastos_usd_tn: num(UI.val(`px-${c}-usd`)) }); await UI.run(async () => { await Store.saveCampania({ precios: P }); App.render(); }, 'Precios guardados'); },
  form(loteId, id) {
    const l = Store.lote(loteId); const p = id ? S.produccion.find(x => x.id === id) : { tipo: 'cosecha', has: num(l.has) - sum(S.produccion.filter(x => x.lote_id === loteId), x => x.has), kg: '', estimado: false, fecha: hoy() };
    if (!id && p.has < 0) p.has = 0;
    UI.modal(`<h3>${id ? 'Editar' : 'Cargar'} producción · ${esc(Store.loteNombre(loteId))} (${fmt(l.has, 1)} ha ${esc(l.cultivo)})</h3>
      <div class="row"><div><label class="f">Tipo</label><select id="pr-tipo" onchange="Tabs.produccion.tipoChange()"><option value="cosecha" ${p.tipo === 'cosecha' ? 'selected' : ''}>Cosecha</option><option value="picado" ${p.tipo === 'picado' ? 'selected' : ''}>Picado (kg estimados)</option></select></div><div><label class="f">Hectáreas</label><input type="number" step="0.1" id="pr-has" value="${p.has}" oninput="Tabs.produccion.calcKg()"></div><div><label class="f">Fecha</label><input type="date" id="pr-fecha" value="${p.fecha || ''}"></div></div>
      <div class="row" style="margin-top:8px"><div><label class="f">Cargar kg</label><select id="pr-modo" onchange="Tabs.produccion.calcKg()"><option value="total">Total del lote</option><option value="ha">Por hectárea</option></select></div><div><label class="f">Kg</label><input type="number" step="1" id="pr-kg-in" value="${p.kg || ''}" oninput="Tabs.produccion.calcKg()"></div><div><label class="f">Kg totales</label><input type="number" id="pr-kg" value="${p.kg || ''}" readonly style="background:#f4f5f2"></div><div><label class="f">Precio USD/tn (opcional)</label><input type="number" step="0.01" id="pr-precio" value="${p.precio_usd_tn ?? ''}" placeholder="precio campaña"></div></div>
      <div class="check" style="margin-top:8px"><input type="checkbox" id="pr-est" ${p.estimado || p.tipo === 'picado' ? 'checked' : ''}><label for="pr-est">Kg estimados (no pesados)</label></div>
      <label class="f">Obs.</label><input type="text" id="pr-obs" value="${esc(p.obs || '')}">
      <div class="foot"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Tabs.produccion.guardar('${loteId}','${id || ''}')">Guardar</button></div>`);
  },
  tipoChange() { if (UI.val('pr-tipo') === 'picado') document.getElementById('pr-est').checked = true; },
  calcKg() { const v = num(UI.val('pr-kg-in')), h = num(UI.val('pr-has')); document.getElementById('pr-kg').value = UI.val('pr-modo') === 'ha' ? Math.round(v * h) : v; },
  async guardar(loteId, id) {
    const row = { lote_id: loteId, tipo: UI.val('pr-tipo'), has: num(UI.val('pr-has')), kg: num(UI.val('pr-kg')), estimado: UI.val('pr-est') || UI.val('pr-tipo') === 'picado', precio_usd_tn: num(UI.val('pr-precio')) || null, fecha: UI.val('pr-fecha') || null, obs: UI.val('pr-obs') };
    if (!row.has) return UI.toast('Faltan las hectáreas', true);
    await UI.run(async () => { if (id) await DB.update('produccion', id, row); else await DB.insert('produccion', { ...row, campania_id: S.campania.id }); S.produccion = await DB.select('produccion', { campania_id: S.campania.id }); UI.closeModal(); App.render(); }, 'Producción guardada');
  },
  async borrar(id) { if (!confirm('¿Eliminar este registro de producción?')) return; await UI.run(async () => { await DB.remove('produccion', id); S.produccion = S.produccion.filter(x => x.id !== id); App.render(); }, 'Eliminado'); },
};

Tabs.cosecha = {
  filtro: { campo: '', lote: '', cultivo: '' },
  filtroUI(tab) { const f = this.filtro; return `<span class="spacer"></span><select style="width:auto" onchange="Tabs.${tab}.filtro.campo=this.value;Tabs.${tab}.filtro.lote='';App.render()">${opts(S.campos, f.campo, c => c.nombre, c => c.id, 'Todos los campos')}</select><select style="width:auto" onchange="Tabs.${tab}.filtro.lote=this.value;App.render()">${opts(f.campo ? Store.lotesDe(f.campo) : S.lotes, f.lote, l => 'L ' + l.nombre + (f.campo ? '' : ' · ' + (Store.campo(l.campo_id) || {}).nombre), l => l.id, 'Todos los lotes')}</select><select style="width:auto" onchange="Tabs.${tab}.filtro.cultivo=this.value;App.render()">${opts(CULTIVOS, f.cultivo, x => x, x => x, 'Todos los cultivos')}</select>`; },
  aplicarFiltro(L) { const f = this.filtro; return L.filter(r => (!f.campo || r.campo.id === f.campo) && (!f.lote || r.lote.id === f.lote) && (!f.cultivo || r.cultivo === f.cultivo)); },

    const tot = sum(S.cosechas, c => c.monto_usd), est = sum(S.cosechas.filter(c => c.estimado), c => c.monto_usd);
    m.innerHTML = `<div class="kpis"><div class="kpi"><div class="l">Costo de cosecha</div><div class="v">${usd(tot)}</div><div class="s">${est ? usd(est) + ' estimados (picado)' : 'todo facturado/real'}</div></div><div class="kpi"><div class="l">Has con costo cargado</div><div class="v">${fmt(sum(S.cosechas, c => c.has), 1)}</div><div class="s">de ${fmt(sum(L, r => r.has), 1)} ha</div></div>${APORTANTES.map(a => `<div class="kpi"><div class="l">${a.id}</div><div class="v">${usd(sum(S.cosechas.filter(c => c.aportante === a.id), c => c.monto_usd))}</div></div>`).join('')}</div>
    <div class="note info">Cargá por lote el contratista, las hectáreas cosechadas, el precio por hectárea, la factura y la fecha. Si el lote se <b>picó</b>, el costo se marca como <b>estimado</b> y queda aclarado en resultados.</div>
    <div class="card"><h2>Cosecha por lote ${this.filtroUI('cosecha')}</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Campo · Lote</th><th>Cultivo</th><th class="num">Has</th><th>Producción</th><th>Costos de cosecha cargados</th><th class="num">Total USD</th><th class="num">USD/ha</th><th></th></tr></thead><tbody>
      ${this.aplicarFiltro(L).map(r => { const cs = S.cosechas.filter(c => c.lote_id === r.lote.id); const t = sum(cs, c => c.monto_usd); return `<tr><td><b>${esc(r.campo.nombre)} · L ${esc(r.lote.nombre)}</b> ${r.participa ? '' : '<span class="tag bad">no soc.</span>'}</td><td class="small">${r.cultivo}</td><td class="num">${fmt(r.has, 1)}</td><td class="small">${r.has_cosechadas ? 'cosechadas ' + fmt(r.has_cosechadas, 1) + ' ha' : ''}${r.has_picadas ? ' <span class="tag warn">picado ' + fmt(r.has_picadas, 1) + ' ha</span>' : ''}</td>
        <td class="small">${cs.map(c => `<div>${esc((Store.contratista(c.contratista_id) || {}).nombre || '—')} · ${fmt(c.has, 1)} ha · ${c.precio_ha_ars ? ars(c.precio_ha_ars) + '/ha' : ''} · <b>${usd(c.monto_usd)}</b> ${c.estimado ? '<span class="tag warn">estimado</span>' : ''} ${c.factura ? 'Fc ' + esc(c.factura) : '<span class="tag bad">s/factura</span>'} ${fdate(c.fecha)} ${tagAp(c.aportante)} <button class="btn xs" onclick="Tabs.cosecha.form('${r.lote.id}','${c.id}')">✎</button> <button class="btn xs danger" onclick="Tabs.cosecha.borrar('${c.id}')">✕</button></div>`).join('')}</td>
        <td class="num"><b>${t ? fmt(t) : ''}</b></td><td class="num">${t && sum(cs, c => c.has) ? fmt(t / sum(cs, c => c.has)) : ''}</td><td class="actions"><button class="btn xs primary" onclick="Tabs.cosecha.form('${r.lote.id}')">+ Cargar</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">Sin lotes.</td></tr>'}</tbody></table></div></div>`;
  },
  form(loteId, id) {
    const l = Store.lote(loteId); const picado = S.produccion.some(p => p.lote_id === loteId && p.tipo === 'picado');
    const c = id ? S.cosechas.find(x => x.id === id) : { has: num(l.has), fecha: hoy(), estimado: picado, aportante: 'PEGSA', contratista_nombre: '' };
    const cn = (Store.contratista(c.contratista_id) || {}).nombre || '';
    UI.modal(`<h3>${id ? 'Editar' : 'Cargar'} costo de cosecha · ${esc(Store.loteNombre(loteId))}</h3>
      ${picado ? '<div class="note">Este lote tiene hectáreas picadas: el costo se marca como <b>estimado</b>.</div>' : ''}
      <div class="row"><div class="w2"><label class="f">Contratista</label>${UI.searchbox('cs-contr', [], { value: cn })}<input type="hidden" id="cs-contr-id" value="${c.contratista_id || ''}"></div><div><label class="f">Fecha</label><input type="date" id="cs-fecha" value="${c.fecha || ''}"></div><div><label class="f">Hectáreas</label><input type="number" step="0.1" id="cs-has" value="${c.has}" oninput="Tabs.cosecha.calc()"></div></div>
      <div class="row" style="margin-top:8px"><div><label class="f">Precio $/ha</label><input type="number" step="0.01" id="cs-precio" value="${c.precio_ha_ars ?? ''}" oninput="Tabs.cosecha.calc()"></div><div><label class="f">TC</label><input type="number" step="0.01" id="cs-tc" value="${c.tc ?? (Tabs.labores.tcSugerido(c.fecha) || '')}" oninput="Tabs.cosecha.calc()"></div><div><label class="f">Monto USD</label><input type="number" step="0.01" id="cs-usd" value="${c.monto_usd ?? ''}"></div><div><label class="f">Factura</label><input type="text" id="cs-fac" value="${esc(c.factura || '')}"></div><div><label class="f">Paga</label><select id="cs-ap">${optsAp(c.aportante)}</select></div></div>
      <div class="check" style="margin-top:8px"><input type="checkbox" id="cs-est" ${c.estimado ? 'checked' : ''}><label for="cs-est">Costo estimado</label></div>
      <label class="f">Obs.</label><input type="text" id="cs-obs" value="${esc(c.obs || '')}">
      <div class="foot"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn primary" onclick="Tabs.cosecha.guardar('${loteId}','${id || ''}')">Guardar</button></div>`,
      () => UI.bindSearch('cs-contr', () => S.contratistas, { onPick: x => document.getElementById('cs-contr-id').value = x.id, onAdd: async n => { const x = await DB.insert('contratistas', { nombre: n.toUpperCase(), activo: true }); S.contratistas.push(x); document.getElementById('cs-contr-id').value = x.id; return x; } }));
  },
  calc() { const h = num(UI.val('cs-has')), p = num(UI.val('cs-precio')), t = num(UI.val('cs-tc')); if (h && p && t) document.getElementById('cs-usd').value = (h * p / t).toFixed(2); },
  async guardar(loteId, id) {

    await UI.run(async () => { if (id) await DB.update('cosechas', id, row); else await DB.insert('cosechas', { ...row, campania_id: S.campania.id }); S.cosechas = await DB.select('cosechas', { campania_id: S.campania.id }); UI.closeModal(); App.render(); }, 'Cosecha guardada');
  },
  async borrar(id) { if (!confirm('¿Eliminar el costo de cosecha?')) return; await UI.run(async () => { await DB.remove('cosechas', id); S.cosechas = S.cosechas.filter(x => x.id !== id); App.render(); }, 'Eliminado'); },
};
</script>

<script>
/* =====================================================================
   PESTAÑA 8 — RESULTADOS

Tabs.resultados = {

    <div class="kpis">${tot ? `<div class="kpi"><div class="l">Costo total</div><div class="v">${usd(tot.costo)}</div><div class="s">${usd(tot.costo_ha)}/ha · ${fmt(tot.has, 1)} ha</div></div><div class="kpi"><div class="l">Venta (valuada)</div><div class="v">${usd(tot.venta)}</div><div class="s">${fmt(tot.kg / 1000, 1)} tn</div></div><div class="kpi"><div class="l">Resultado</div><div class="v ${tot.resultado < 0 ? 'neg' : 'pos'}">${usd(tot.resultado)}</div><div class="s">${pct(tot.costo ? tot.resultado / tot.costo : null)} sobre costos</div></div>` : ''}
      ${CULTIVOS.map(c => { const g = Calc.agrupar(part.filter(r => r.cultivo === c), () => c, () => c)[0]; return g ? `<div class="kpi"><div class="l">${c} · rinde indif.</div><div class="v">${g.rinde_indif ? fmt(g.rinde_indif, 1) + ' qq/ha' : '—'}</div><div class="s">costo ${usd(g.costo_ha)}/ha · rinde real ${g.kg ? fmt(g.rinde / 100, 1) + ' qq/ha' : '—'}</div></div>` : ''; }).join('')}</div>
    <div class="card"><h2>Resultados <span class="spacer"></span><div class="subtabs" style="margin:0">${[['campo_cultivo', 'Campo × cultivo'], ['campo', 'Por campo'], ['cultivo', 'Por cultivo'], ['lote', 'Por lote']].map(([k, l]) => `<button class="${this.vista === k ? 'active' : ''}" onclick="Tabs.resultados.vista='${k}';App.render()">${l}</button>`).join('')}</div></h2>
      ${this.tabla(grupos(this.vista).filter(g => this.vista !== 'lote' || g.participa), tot)}</div>
    ${nopart.length ? `<div class="card"><h2>Campos / lotes que NO entran en la sociedad</h2><p class="muted small">Se muestran aparte: no generan participación. Los costos que aportó otro socio se exponen como deuda en la pestaña Participación.</p>${this.tabla(nopart.map(r => ({ ...r, label: r.campo.nombre + ' · L ' + r.lote.nombre + ' (a cargo de ' + (r.campo.dueno || 'PEGSA') + ')', lotes: [r] })), Calc.agrupar(nopart, () => 'T', () => 'TOTAL NO SOCIEDAD')[0])}</div>` : ''}`;
  },
  tabla(rows, tot) {
    const cell = (v, d = 0) => `<td class="num">${v ? fmt(v, d) : ''}</td>`;
    const fila = (g, cls = '') => `<tr class="${cls}"><td><b>${esc(g.label)}</b>${g.kg_estimado ? ' <span class="tag warn" title="kg estimados">est.</span>' : ''}</td>${cell(g.has, 1)}${cell(g.alquiler)}${cell(g.insumos)}${cell(g.labores)}${cell(g.varios)}${cell(g.cosecha)}<td class="num"><b>${fmt(g.costo)}</b></td>${cell(g.costo_ha)}${cell(g.kg)}${cell(g.kg ? g.rinde / 100 : 0, 1)}${cell(g.precio_neto, 1)}${cell(g.venta)}<td class="num ${g.resultado < 0 ? 'neg' : 'pos'}"><b>${g.kg ? fmt(g.resultado) : ''}</b></td><td class="num ${g.resultado < 0 ? 'neg' : 'pos'}">${g.kg && g.costo ? pct(g.resultado / g.costo) : ''}</td>${cell(g.venta && g.has ? g.venta / g.has : 0)}<td class="num"><b>${g.rinde_indif ? fmt(g.rinde_indif, 1) : '—'}</b></td></tr>`;
    return `<div class="tablewrap"><table class="t compact"><thead><tr><th></th><th class="num">Has</th><th class="num">Alquiler</th><th class="num">Insumos</th><th class="num">Labores</th><th class="num">Varios</th><th class="num">Cosecha</th><th class="num">Costo total</th><th class="num">Costo/ha</th><th class="num">Kg</th><th class="num">Rinde qq/ha</th><th class="num">Precio neto</th><th class="num">Venta</th><th class="num">Resultado</th><th class="num">Res. %</th><th class="num">Venta/ha</th><th class="num">Rinde indif. qq/ha</th></tr></thead><tbody>
      ${rows.map(g => fila(g)).join('') || '<tr><td colspan="17" class="muted">Sin datos.</td></tr>'}</tbody>${tot ? `<tfoot>${fila(tot)}</tfoot>` : ''}</table></div>
      <p class="muted small" style="margin-top:6px">Todo en USD. <b>Rinde de indiferencia</b> = costo total por ha ÷ precio neto del cereal (qq/ha necesarios para cubrir costos). Alquiler, insumos, labores y cosecha vienen de las pestañas 1, 4, 3 y 7; los costos varios de la 5 (los generales se reparten por ha entre los lotes que participan).</p>`;
  },
};

/* =====================================================================
   PESTAÑA 9 — PARTICIPACIÓN
   ===================================================================== */
Tabs.participacion = {
  render(m) {
    const P = Calc.participacion(); const pact = S.campania.participacion_pactada || {};
    const ajustes = this.ajustes(P.filas);
    m.innerHTML = `<div class="note info"><b>Participación antes de cosecha</b>: se suma lo que cada socio aportó (alquiler + insumos + labores + costos varios) en los lotes que entran en la sociedad, y se compara con lo pactado (${APORTANTES.map(a => a.id + ' ' + fmt(pact[a.id], 0) + ' %').join(' · ')}). Los campos que no entran en la sociedad se tratan aparte, más abajo. El alquiler se computa <b>devengado</b>: sólo los meses con cotización cargada (${Calc.alquiler().meses_devengados} de 12).</div>
    <div class="kpis">${P.filas.map(f => `<div class="kpi"><div class="l">${esc(aportanteNombre(f.aportante))}</div><div class="v">${pct(f.pct)}</div><div class="s">${usd(f.total)} aportados · pactado ${pct(f.pct_pactada, 0)}</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100, f.pct * 100)}%;background:var(--${f.aportante.toLowerCase()})"></i></div></div>`).join('')}<div class="kpi"><div class="l">Total aportado</div><div class="v">${usd(P.total)}</div><div class="s">${P.sinAsignar ? '<span class="neg">' + usd(P.sinAsignar) + ' sin aportante</span>' : 'todo asignado'}</div></div></div>
    <div class="card"><h2>Aportes por socio (lotes en sociedad)</h2><div class="tablewrap"><table class="t"><thead><tr><th>Socio</th><th class="num">Alquiler</th><th class="num">Insumos</th><th class="num">Labores</th><th class="num">Varios</th><th class="num">Total aportado</th><th class="num">% real</th><th class="num">% pactado</th><th class="num">Le corresponde</th><th class="num">Diferencia</th></tr></thead><tbody>
      ${P.filas.map(f => `<tr><td>${tagAp(f.aportante)} ${esc(aportanteNombre(f.aportante))}</td><td class="num">${fmt(f.alquiler)}</td><td class="num">${fmt(f.insumos)}</td><td class="num">${fmt(f.labores)}</td><td class="num">${fmt(f.varios)}</td><td class="num"><b>${fmt(f.total)}</b></td><td class="num"><b>${pct(f.pct)}</b></td><td class="num">${pct(f.pct_pactada, 0)}</td><td class="num">${fmt(P.total * f.pct_pactada)}</td><td class="num ${f.dif_usd > 0 ? 'pos' : f.dif_usd < 0 ? 'neg' : ''}">${f.dif_usd > 0 ? '+' : ''}${fmt(f.dif_usd)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${fmt(sum(P.filas, f => f.alquiler))}</td><td class="num">${fmt(sum(P.filas, f => f.insumos))}</td><td class="num">${fmt(sum(P.filas, f => f.labores))}</td><td class="num">${fmt(sum(P.filas, f => f.varios))}</td><td class="num">${fmt(P.total)}</td><td class="num">100 %</td><td class="num">100 %</td><td></td><td></td></tr></tfoot></table></div>
      ${ajustes.length ? `<h3 style="margin-top:12px">Para llegar a lo pactado</h3>${ajustes.map(a => `<div>• <b>${esc(a.de)}</b> debe a <b>${esc(a.a)}</b>: <b>${usd(a.usd)}</b> (aportó de más ${esc(a.a)} / de menos ${esc(a.de)})</div>`).join('')}` : '<p class="muted small" style="margin-top:8px">Los aportes coinciden con lo pactado.</p>'}</div>
    <div class="card"><h2>Aportes por categoría</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Categoría</th>${APORTANTES.map(a => `<th class="num">${a.id}</th>`).join('')}<th class="num">Sin asignar</th><th class="num">Total</th><th class="num">%</th></tr></thead><tbody>
      ${P.categorias.map(c => `<tr><td><b>${esc(c.categoria)}</b></td>${APORTANTES.map(a => `<td class="num">${c[a.id] ? fmt(c[a.id]) : ''}</td>`).join('')}<td class="num neg">${c['SIN ASIGNAR'] ? fmt(c['SIN ASIGNAR']) : ''}</td><td class="num"><b>${fmt(c.total)}</b></td><td class="num">${pct(P.total ? c.total / (P.total + P.sinAsignar) : null)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Sin aportes.</td></tr>'}</tbody></table></div><p class="muted small">Insumos por categoría del catálogo (se asigna al crear el insumo o desde Stock), labores por tipo de orden. Sólo lotes en sociedad, sin cosecha.</p></div>
    <div class="grid2"><div class="card"><h2>Cosecha: costo a pagar según participación</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Socio</th><th class="num">% part.</th><th class="num">Le corresponde</th><th class="num">Pagó</th><th class="num">Diferencia</th></tr></thead><tbody>
      ${P.cosechaFilas.map(f => `<tr><td>${tagAp(f.aportante)}</td><td class="num">${pct(P.filas.find(x => x.aportante === f.aportante).pct)}</td><td class="num">${fmt(f.corresponde)}</td><td class="num">${fmt(f.pagado)}</td><td class="num ${f.dif > 0 ? 'pos' : f.dif < 0 ? 'neg' : ''}">${f.dif > 0 ? '+' : ''}${fmt(f.dif)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total cosecha</td><td></td><td class="num">${fmt(P.cosechaTotal)}</td><td class="num">${fmt(P.cosechaTotal)}</td><td></td></tr></tfoot></table></div></div>
      <div class="card"><h2>Cereal a retirar según participación</h2><div class="tablewrap"><table class="t compact"><thead><tr><th>Socio</th><th class="num">% part.</th>${CULTIVOS.map(c => `<th class="num">${c} kg</th>`).join('')}</tr></thead><tbody>
      ${P.filas.map(f => `<tr><td>${tagAp(f.aportante)}</td><td class="num">${pct(f.pct)}</td>${CULTIVOS.map(c => `<td class="num">${fmt(P.kgPorCultivo[c] * f.pct)}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td>${CULTIVOS.map(c => `<td class="num">${fmt(P.kgPorCultivo[c])}</td>`).join('')}</tr></tfoot></table></div><p class="muted small">Kg producidos en los lotes en sociedad (incluye estimados de picado).</p></div></div>
    <div class="card"><h2>Campos que NO entran en la sociedad · deudas entre socios</h2>
      ${P.deudas.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Campo</th><th>A cargo de</th><th>Aportó</th><th class="num">Alquiler</th><th class="num">Insumos</th><th class="num">Labores</th><th class="num">Varios</th><th class="num">Cosecha</th><th class="num">Total</th></tr></thead><tbody>
      ${P.deudas.map(d => `<tr><td><b>${esc(d.campo.nombre)}</b></td><td>${tagAp(d.dueno)}</td><td>${tagAp(d.acreedor)}</td><td class="num">${fmt(d.alquiler)}</td><td class="num">${fmt(d.insumos)}</td><td class="num">${fmt(d.labores)}</td><td class="num">${fmt(d.varios)}</td><td class="num">${fmt(d.cosecha)}</td><td class="num"><b>${fmt(d.total)}</b></td></tr>`).join('')}</tbody></table></div>
      ${P.deudas.map(d => `<div style="margin-top:6px">→ <b>${esc(aportanteNombre(d.dueno))}</b> le debe <b>${usd(d.total)}</b> a <b>${esc(aportanteNombre(d.acreedor))}</b> por ${esc(d.campo.nombre)}${d.insumos ? ' (insumos ' + usd(d.insumos) + ')' : ''}${d.labores ? ' (labores ' + usd(d.labores) + ')' : ''}.</div>`).join('')}` : `<p class="muted">${P.nopart.length ? 'Los campos fuera de la sociedad no tienen costos aportados por otros socios.' : 'No hay campos ni lotes fuera de la sociedad en esta campaña.'}</p>`}</div>`;
  },
  // quién le debe a quién para igualar lo pactado (algoritmo simple acreedores/deudores)
  ajustes(filas) {
    const acre = filas.filter(f => f.dif_usd > 0.5).map(f => ({ id: f.aportante, v: f.dif_usd })), deud = filas.filter(f => f.dif_usd < -0.5).map(f => ({ id: f.aportante, v: -f.dif_usd })); const out = [];
    let i = 0, j = 0; while (i < acre.length && j < deud.length) { const v = Math.min(acre[i].v, deud[j].v); out.push({ de: deud[j].id, a: acre[i].id, usd: v }); acre[i].v -= v; deud[j].v -= v; if (acre[i].v < 0.5) i++; if (deud[j].v < 0.5) j++; }
    return out;
  },
};
</script>

<script>
/* =====================================================================
   DASHBOARD + PROYECCIÓN DEL AGRÓNOMO
   ===================================================================== */
Tabs.dashboard = {
  charts: [],
  render(m) {
    this.charts.forEach(c => c.destroy()); this.charts = [];
    const L = Calc.lotesCalc(), part = L.filter(r => r.participa); const P = Calc.participacion(); const proy = S.campania.proyeccion || {};
    const tot = Calc.agrupar(part, () => 'T', () => 'T')[0] || { has: 0, alquiler: 0, insumos: 0, labores: 0, varios: 0, cosecha: 0, costo: 0, venta: 0, kg: 0 };
    const pendStock = S.movimientos_stock.filter(x => x.tipo === 'salida' && !(num(x.precio_usd) > 0 || (x.remito_mov_id && num((S.movimientos_stock.find(r => r.id === x.remito_mov_id) || {}).precio_usd) > 0))).length, pendLab = S.labores.filter(l => !l.factura).length;
    const rubros = ['alquiler', 'insumos', 'labores', 'varios', 'cosecha'];
    // proyección por cultivo
    const cult = CULTIVOS.map(c => { const arr = part.filter(r => r.cultivo === c); const has = sum(arr, r => r.has); const p = proy[c] || {}; const real = {}; rubros.forEach(k => real[k] = has ? sum(arr, r => r[k]) / has : 0); const pr = {}; rubros.forEach(k => pr[k] = num(p[k])); const proyTot = rubros.reduce((s, k) => s + pr[k], 0), realTot = rubros.reduce((s, k) => s + real[k], 0);
      const precio = num(p.precio_usd_tn), rinde = num(p.rinde_qq); const ventaP = rinde / 10 * precio; return { c, has, real, pr, proyTot, realTot, precio, rinde, ventaP, resP: ventaP - proyTot, realRinde: sum(arr, r => r.has_prod) ? sum(arr, r => r.kg) / sum(arr, r => r.has_prod) / 100 : 0 }; });
    m.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">Hectáreas en sociedad</div><div class="v">${fmt(tot.has, 1)}</div><div class="s">${CULTIVOS.map(c => c + ' ' + fmt(sum(part.filter(r => r.cultivo === c), r => r.has), 0)).join(' · ')}</div></div>
      <div class="kpi"><div class="l">Costo acumulado</div><div class="v">${usd(tot.costo)}</div><div class="s">${usd(tot.costo_ha)}/ha</div></div>
      <div class="kpi"><div class="l">Proyectado (agrónomo)</div><div class="v">${usd(sum(cult, x => x.proyTot * x.has))}</div><div class="s">${sum(cult, x => x.proyTot * x.has) ? pct(tot.costo / sum(cult, x => x.proyTot * x.has)) + ' ejecutado' : 'sin proyección cargada'}</div></div>
      <div class="kpi"><div class="l">Órdenes de trabajo</div><div class="v">${S.ordenes.length}</div><div class="s">${pendLab ? '<span class="neg">' + pendLab + ' labores sin factura</span>' : 'todas facturadas'}</div></div>
      <div class="kpi"><div class="l">Insumos sin precio</div><div class="v ${pendStock ? 'neg' : 'pos'}">${pendStock}</div><div class="s">salidas de OT sin precio (Stock → Movimientos)</div></div>
      ${P.filas.map(f => `<div class="kpi"><div class="l">Participación ${f.aportante}</div><div class="v">${pct(f.pct)}</div><div class="s">pactado ${pct(f.pct_pactada, 0)} · ${usd(f.total)}</div></div>`).join('')}
    </div>
    <div class="grid2">
      <div class="card"><h2>Costos por rubro (USD)</h2><div class="chartbox"><canvas id="ch-rubros"></canvas></div></div>
      <div class="card"><h2>Costos por campo</h2><div class="chartbox"><canvas id="ch-campos"></canvas></div></div>
      <div class="card"><h2>Real vs. proyectado (USD/ha)</h2><div class="chartbox"><canvas id="ch-proy"></canvas></div></div>
      <div class="card"><h2>Participación real vs. pactada</h2><div class="chartbox"><canvas id="ch-part"></canvas></div></div>
    </div>
    <div class="card"><h2>Proyección del agrónomo <span class="spacer"></span><button class="btn sm" onclick="Tabs.dashboard.proyForm()">Editar proyección</button></h2>
      ${Object.keys(proy).length ? `<div class="tablewrap"><table class="t compact"><thead><tr><th>Cultivo</th><th>Rubro</th><th class="num">Proyectado USD/ha</th><th class="num">Real USD/ha</th><th class="num">% ejecutado</th><th class="num">Desvío USD/ha</th><th class="num">Desvío total USD</th><th>Avance</th></tr></thead><tbody>
      ${cult.map(x => rubros.map((k, i) => { const ej = x.pr[k] ? x.real[k] / x.pr[k] : null; return `<tr>${i === 0 ? `<td rowspan="6"><b>${x.c}</b><div class="muted small">${fmt(x.has, 1)} ha</div></td>` : ''}<td>${k}</td><td class="num">${fmt(x.pr[k])}</td><td class="num">${fmt(x.real[k])}</td><td class="num">${pct(ej, 0)}</td><td class="num ${x.real[k] - x.pr[k] > 0 ? 'neg' : ''}">${x.pr[k] ? (x.real[k] - x.pr[k] > 0 ? '+' : '') + fmt(x.real[k] - x.pr[k]) : ''}</td><td class="num ${x.real[k] - x.pr[k] > 0 ? 'neg' : ''}">${x.pr[k] ? (x.real[k] - x.pr[k] > 0 ? '+' : '') + fmt((x.real[k] - x.pr[k]) * x.has) : ''}</td><td style="min-width:120px"><div class="bar"><i class="${ej > 1 ? 'over' : ''}" style="width:${Math.min(100, (ej || 0) * 100)}%"></i></div></td></tr>`; }).join('') + `<tr class="group"><td>Total</td><td class="num">${fmt(x.proyTot)}</td><td class="num">${fmt(x.realTot)}</td><td class="num">${pct(x.proyTot ? x.realTot / x.proyTot : null, 0)}</td><td class="num ${x.realTot - x.proyTot > 0 ? 'neg' : ''}">${x.proyTot ? (x.realTot - x.proyTot > 0 ? '+' : '') + fmt(x.realTot - x.proyTot) : ''}</td><td class="num ${x.realTot - x.proyTot > 0 ? 'neg' : ''}">${x.proyTot ? (x.realTot - x.proyTot > 0 ? '+' : '') + fmt((x.realTot - x.proyTot) * x.has) : ''}</td><td class="small muted">rinde esp. ${fmt(x.rinde, 1)} qq/ha · precio ${usd(x.precio)}/tn → resultado proy. ${usd(x.resP)}/ha${x.realRinde ? ' · rinde real ' + fmt(x.realRinde, 1) : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Todavía no se cargó la proyección. Cargá los costos esperados por hectárea, el rinde y el precio de cada cultivo para ver el avance y el desvío.</p>'}</div>`;
    // charts
    const colors = { alquiler: '#2f6b3a', insumos: '#2c5f8a', labores: '#b7791f', varios: '#7a6f9b', cosecha: '#8a4b2c' };
    const apColor = { PEGSA: '#2f6b3a', GYV: '#2c5f8a', MERZ: '#b7791f' };
    const mk = (id, cfg) => { const el = document.getElementById(id); if (el && window.Chart) this.charts.push(new Chart(el, cfg)); };
    mk('ch-rubros', { type: 'doughnut', data: { labels: rubros, datasets: [{ data: rubros.map(k => Math.round(tot[k])), backgroundColor: rubros.map(k => colors[k]) }] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } } });
    const campos = Calc.agrupar(part, r => r.campo.id, r => r.campo.nombre);
    mk('ch-campos', { type: 'bar', data: { labels: campos.map(c => c.label), datasets: rubros.map(k => ({ label: k, data: campos.map(c => Math.round(c[k])), backgroundColor: colors[k], stack: 's' })) }, options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } } });
    mk('ch-proy', { type: 'bar', data: { labels: cult.map(x => x.c), datasets: [{ label: 'Proyectado', data: cult.map(x => Math.round(x.proyTot)), backgroundColor: '#c9d3c8' }, { label: 'Real', data: cult.map(x => Math.round(x.realTot)), backgroundColor: '#2f6b3a' }] }, options: { maintainAspectRatio: false } });
    mk('ch-part', { type: 'bar', data: { labels: P.filas.map(f => f.aportante), datasets: [{ label: 'Pactado %', data: P.filas.map(f => +(f.pct_pactada * 100).toFixed(1)), backgroundColor: '#c9d3c8' }, { label: 'Real %', data: P.filas.map(f => +(f.pct * 100).toFixed(1)), backgroundColor: P.filas.map(f => apColor[f.aportante] || '#888') }] }, options: { maintainAspectRatio: false, scales: { y: { max: 100 } } } });
